<script>

prices:{flour:{p:1.2,a:'gluten'},water:{p:0,a:''},salt:{p:0.8,a:''},levain:{p:1,a:'gluten'}},

function up(p,v,num){const k=p.split('.'),l=k.pop();at(k.join('.'))[l]=num?(+v||0):v;save();draw()}

function tools(){
 return`<div class="card"><h3>Dough temperature</h3><p class="mut">Water temperature that hits your target dough temperature (°C).</p><div class="row"><label>Target${tn('t1',24)}</label><label>Flour${tn('t2',20)}</label><label>Room${tn('t3',22)}</label><label>Levain${tn('t4',24)}</label><label>Friction${tn('t5',0)}</label></div><p class="big" id="r1"></p></div>
 <div class="card"><h3>Levain builder</h3><p class="mut">Starter : flour : water ratio.</p><div class="row"><label>Levain needed (g)${tn('l1',200)}</label><label>Starter${tn('l2',1)}</label><label>Flour${tn('l3',5)}</label><label>Water${tn('l4',5)}</label></div><p id="r2"></p></div>`}

const AL=['Celery','Gluten','Crustaceans','Eggs','Fish','Lupin','Milk','Molluscs','Mustard','Nuts','Peanuts','Sesame','Soya','Sulphites'];
const UN=['g','kg','ml','l','each'],FAC={g:1,kg:1000,ml:1,l:1000,each:1},BASE={g:'g',kg:'g',ml:'ml',l:'ml',each:'each'};
const gi=n=>(typeof srIng=='function'&&srIng(n))||S.ings.find(g=>key(g.n)==key(n));

const fq=(v,u)=>u=='each'?(Math.round(v*10)/10)+' pcs':v>=1000?(v/1000).toFixed(2)+(u=='g'?' kg':' l'):Math.round(v)+' '+u;

const dstr=d=>d.toLocaleDateString('en-IE');
function mig(){
 S.ings=S.ings||[];
 const seen={};S.ings.forEach(g=>seen[key(g.n)]=1);
 const nm=s=>AL.find(x=>x.toLowerCase()==s.toLowerCase())||s;
 S.prods.forEach(p=>{
  p.ings.forEach(i=>{const k=key(i.n);if(k&&!seen[k]){seen[k]=1;const x=(S.prices||{})[k]||{p:0,a:''};S.ings.push({n:i.n,price:x.p||0,size:1,unit:'kg',al:x.a?x.a.split(/[,;]\s*/).filter(Boolean).map(nm):[],waste:0})}if(i.amt==null)i.amt=0});
  p.mode=p.mode||'pct';p.yt=p.yt||'weight';p.batch=p.batch||1;p.flourG=p.flourG||1000;p.shelf=p.shelf||3;if(p.store==null)p.store='Keep in a cool, dry place.'});

 S.lab=S.lab||{pid:'all',copies:0,size:'a8',made:new Date().toISOString().slice(0,10),code:'',price:false};
}

function calc(p){
 const b=Math.max(+p.batch||1,1),pc=p.mode=='pct',sum=p.ings.reduce((a,i)=>a+(+i.pct||0),0)||1;

 const lines=p.ings.map(i=>({n:i.n,g:pc?f*(+i.pct||0)/100:(+i.amt||0)/(p.yt=='batch'?b:1)}));

 const w=lines.filter(l=>/water/i.test(l.n)).reduce((a,l)=>a+l.g,0),fl=lines.filter(l=>/flour/i.test(l.n)).reduce((a,l)=>a+l.g,0);
 return{lines,cost,ing,sum,hyd:fl?w/fl*100:0}}

const used=n=>S.prods.filter(p=>p.ings.some(x=>key(x.n)==key(n))).length;

function plan(){
 const q={};dO().forEach(o=>q[o.pid]=(q[o.pid]||0)+o.qty);

 let h=`<div class="row noprint"><label>Ready at<input type="datetime-local" value="${esc(S.set.ready)}" onchange="up('set.ready',this.value)"></label><button class="b" onclick="print()">Print the whole plan</button></div>`;
 if(!act.length)return h+`<p class="mut">No orders for <b>${dlab(pday())}</b>. Add orders or daily targets on the Orders tab, or change the Ready at date above.</p>`;

 act.forEach(p=>{let t=pEnd(p,pday());[...p.steps].reverse().forEach(s=>{const st=t-(+s.mins||0)*6e4,k=st+'|'+key(s.n)+'|'+t;(ev[k]=ev[k]||{st,t,n:s.n,ps:[]}).ps.push(p.name);t=st})});

 let rev=0,cost=0,tot=0,shop={};
 act.forEach(p=>{const c=calc(p);rev+=q[p.id]*p.price;cost+=q[p.id]*c.cost;(typeof xl=='function'?xl(c.lines):c.lines).forEach(l=>{const k=key(l.n),g=gi(l.n),x=l.g*bq(p);shop[k]=shop[k]||{n:l.n,g:0,u:bu(l.n),c:0};shop[k].g+=x;shop[k].c+=x*ppu(g)/wf(g)})});

const rs=r=>r.made==null&&r.sold!=null?+r.sold:Math.max((+r.made||0)-(+r.left||0),0);
const rdem=r=>r.out?Math.max(rs(r),+r.made||0)*1.15:rs(r);

function fcast(pid,date){
 const H=hist(pid).filter(h=>h.d<date),wd=dow(date),same=H.filter(h=>dow(h.d)==wd).slice(-8),n=same.length;
 let avg=0,ws=0;same.forEach((h,k)=>{avg+=rdem(h.r)*(k+1);ws+=k+1});if(ws)avg/=ws;
 const plain=n?same.reduce((a,h)=>a+rs(h.r),0)/n:0;
 const ly=addD(date,-364),win=(a,b)=>H.filter(h=>h.d>=addD(ly,a)&&h.d<=addD(ly,b)).map(h=>rdem(h.r)),av=x=>x.reduce((a,b)=>a+b,0)/x.length;
 const A=win(-14,14),B=win(-70,-15);let sea=1;if(A.length>=5&&B.length>=5&&av(B)>0)sea=Math.min(1.6,Math.max(.6,av(A)/av(B)));
 const adj=1+(+S.adj[date]||0)/100,rec=n?Math.ceil(avg*sea*adj*(1+(+S.set.buf||0)/100)):0;
 return{n,avg,plain,sea,adj,rec,outs:same.filter(h=>h.r.out).length,vals:same.map(h=>rs(h.r))}}

function dOf(d){
 const r=S.orders.filter(o=>o.date==d);
 S.prods.forEach(p=>{let q=+((S.par||{})[p.id]||{})[dow(d)]||0,c='Counter (daily target)';
  if(S.set.useFc&&S.sales){const f=fcast(p.id,d);if(f.n>=3){q=f.rec;c='Counter (forecast)'}}

 return r}

// oven
const isBake=s=>/bake|oven|pec/i.test(s.n||'');
function oven(d){
 const tot=totOf(d),cap=Math.max(+S.set.trays||1,1),miss=[],grp={};
 S.prods.filter(p=>tot[p.id]>0).forEach(p=>{const b=[...p.steps].reverse().find(isBake);if(!b)return;if(!(+p.tray>0)){miss.push(p.name);return}const n=bakeN(p.id,tot[p.id]);(grp[+p.temp||0]=grp[+p.temp||0]||[]).push({p,tr:Math.ceil(n/p.tray),mins:+b.mins||0})});
 const loads=[];Object.keys(grp).sort((a,b)=>b-a).forEach(t=>{let cur=null;grp[t].sort((a,b)=>b.mins-a.mins).forEach(x=>{let left=x.tr;while(left>0){if(!cur||cur.used>=cap){cur={t:+t,used:0,mins:0,items:[]};loads.push(cur)}const put=Math.min(left,cap-cur.used);cur.used+=put;cur.mins=Math.max(cur.mins,x.mins);cur.items.push({name:x.p.name,tr:put});left-=put}})});
 const totm=loads.reduce((a,l)=>a+l.mins,0)+Math.max(loads.length-1,0)*(+S.set.chg||0);
 return{loads,totm,extra:Math.max(0,totm-Math.max(0,...loads.map(l=>l.mins))),miss,cap}}
function ovenHTML(d){
 const o=oven(d);if(!o.loads.length&&!o.miss.length)return'';
 const end=endOf(d),ch=+S.set.chg||0;let t=end-o.totm*6e4;
 const rows=o.loads.map((l,k)=>{const s=t;t+=(l.mins+ch)*6e4;return`<tr><td>Load ${k+1}</td><td>${hh(s)}–${hh(s+l.mins*6e4)}</td><td>${l.t?l.t+' °C':''}</td><td class="wrap">${l.items.map(x=>`${x.tr} tray${x.tr>1?'s':''} ${esc(x.name)}`).join(', ')}</td></tr>`}).join('');
 return`<h2>Oven</h2><p>${o.loads.length>1?`Needs <b>${o.loads.length} loads</b> (${o.cap} trays at a time), about ${hm(o.totm)} of baking. Start the first load at <b>${hh(end-o.totm*6e4)}</b>, ${hm(o.extra)} earlier than the bake times in the schedule.`:o.loads.length?'Everything fits in one load.':''}</p>${rows?`<div class="scroll"><table>${rows}</table></div>`:''}${o.miss.length?`<p class="mut">Set “units per oven tray” on: ${o.miss.map(esc).join(', ')}.</p>`:''}`}

function money(d){
 const tot={},ord={};dOf(d).forEach(o=>{tot[o.pid]=(tot[o.pid]||0)+o.qty;if(!o.par)ord[o.pid]=(ord[o.pid]||0)+o.qty});
 let rev=0,cost=0,waste=0,guess=false;
 S.prods.filter(p=>tot[p.id]>0).forEach(p=>{const n=bakeN(p.id,tot[p.id]),uc=calc(p).cost,o=ord[p.id]||0,c=n-o,f=fcast(p.id,d);let sell=c;if(c>0){if(f.n>=3)sell=Math.min(c,Math.round(f.avg*f.sea*f.adj));else guess=true}rev+=(o+sell)*(+p.price||0);cost+=n*uc;waste+=(c-sell)*uc});
 return{rev,cost,profit:rev-cost,waste,guess}}

const pTot=p=>p.steps.reduce((a,s)=>a+(+s.mins||0),0)*6e4;

const pEnd=(p,d)=>{if(!p)return endOf(d);const w=pWhen(p),base=addD(d,+w.day||0);let t=w.t?new Date(base+'T'+w.t).getTime():(+w.day?new Date(base+'T16:00').getTime():endOf(d));if(w.k=='start')t+=pTot(p);return t+(+((S.shift||{})[d+'|'+p.id])||0)*6e4};
const dS=d=>new Date(d+'T00:00').getTime(),dE=d=>dS(addD(d,1));
function dayWork(d){
 const out=[];
 for(let i=0;i<4;i++){const x=addD(d,i),E=sched(x);if(!i){out.push(...E);continue}
  const ids=[...new Set(E.filter(e=>e.st<dE(d)).map(e=>e.ps[0].id))];out.push(...E.filter(e=>ids.includes(e.ps[0].id)))}
 return out}

 return Object.values(L).map(l=>{const M=(S.kb||{})[l.fd]||{};l.steps.sort((a,b)=>a.j-b.j);l.today=l.steps.filter(e=>e.st>=dS(d)&&e.st<dE(d));l.first=l.today[0]||l.steps[0];l.done=l.today.length&&l.today.every(e=>M[e.k]==2);return l}).filter(l=>l.today.length).sort((a,b)=>a.first.st-b.first.st)}

 const M=S.kb[fd]=S.kb[fd]||{};S.kbt=S.kbt||{};const T=S.kbt[fd]=S.kbt[fd]||{};
 M[k]=n;if(n==1)T[k]={s:Date.now(),x:0};else delete T[k];
 if(n==2&&auto){const nx=E.find(x=>x.ps[0].id==e.ps[0].id&&x.j==e.j+1);if(nx&&!M[nx.k]){M[nx.k]=1;T[nx.k]={s:Date.now(),x:0};flash(`${nx.n} started`)}}

 const ev=[],ready=[],lanes={};
 for(let i=0;i<=4;i++){const x=addD(d,i);sched(x).forEach(e=>{const lk=e.ps[0].id+'@'+x;(lanes[lk]=lanes[lk]||[]).push(e)})}
 Object.entries(lanes).forEach(([lk,E])=>{E.sort((a,b)=>a.j-b.j);const cur=E.find(e=>kst(e)!=2),end=E[E.length-1].t;
  E.forEach(e=>{const on=e.st>=dS(d)&&e.st<dE(d),carry=e.st<dS(d)&&e.t>dS(d);if(on||carry)ev.push({...e,lk,carry,cur:e==cur,first:e.j==0})});
  if(end>=dS(d)&&end<dE(d)){const p=S.prods.find(q=>q.id==E[0].ps[0].id);ready.push({t:end,name:E[0].ps[0].name,q:bakeN(E[0].ps[0].id,E[0].ps[0].q),fd:E[0].fd,done:!cur,id:E[0].ps[0].id})}});
 ev.sort((a,b)=>(a.carry?0:1)-(b.carry?0:1)||a.st-b.st||a.t-b.t);ready.sort((a,b)=>a.t-b.t);
 return{ev,ready}}

// ---------- sub-recipes: a recipe used as an ingredient (levain, frosting, caramel) ----------
const subOf=n=>S.prods.find(x=>x.sub&&key(x.name)==key(n||''));
const srStk=new Set();
// a sub-recipe looks like an ingredient priced at its own cost per kg, with its allergens
function srIng(n){const p=subOf(n);if(!p||srStk.has(p.id))return undefined;srStk.add(p.id);
 try{const c=calc(p),w=+p.unitG||1,al=[...new Set(c.lines.flatMap(l=>(gi(l.n)||{al:[]}).al||[]))];return{n:p.name,price:c.cost/w*1000,size:1,unit:'kg',al,waste:0,sr:p.id,sup:''}}finally{srStk.delete(p.id)}}
// expand sub-recipe lines into the raw ingredients you buy
function xl(lines,dep){dep=dep||0;const out=[];lines.forEach(l=>{const s=dep<4&&l.n&&l.g?subOf(l.n):null;if(s){const f=l.g/(+s.unitG||1);out.push(...xl(calc(s).lines.map(x=>({...x,g:x.g*f})),dep+1))}else out.push(l)});return out}
const estW=p=>{const b=p.yt=='batch'?Math.max(+p.batch||1,1):1;return Math.round(calc(p).lines.reduce((a,l)=>a+(bu(l.n)=='each'?l.g*55:l.g),0)*b)};
function setSub(i,on){const p=S.prods[i];if(on){if(p.mode=='pct'&&p.yt!='batch')p.flourG=Math.round(calc(p).lines.filter(l=>/flour/i.test(l.n)).reduce((a,l)=>a+l.g,0))||p.flourG||1000;else if(p.mode!='pct'&&p.yt!='batch'){}p.yt='batch';p.batch=1;p.unitG=estW(p)||p.unitG;p.sub=true;p.price=0;p.sp=0;p.sell='whole'}else delete p.sub;save();draw()}
const usedIn=p=>S.prods.filter(x=>x.id!=p.id&&x.ings.some(l=>key(l.n)==key(p.name)));
// schedule: sub-recipe prep is its own lane, finished before the first product that uses it starts
function sched(d){
 const tot=totOf(d),out=[],seen=new Set(),shf=id=>+((S.shift||{})[d+'|'+id])||0;
 // a sub-recipe moved later pushes the products that use it later by the same amount
 const push=p=>Math.max(0,...calc(p).lines.map(l=>{const s=subOf(l.n);return s&&s.id!=p.id?shf(s.id):0}))*6e4;
 const lane=(p,q,end)=>{let t=end;const a=[];for(let j=p.steps.length-1;j>=0;j--){const s=p.steps[j],st=t-(+s.mins||0)*6e4;a.unshift({k:p.id+'#'+j,j,fd:d,st,t,n:s.n||'Step '+(j+1),dsc:s.d||'',ps:[{id:p.id,name:p.name,q}]});t=st}return a};
 let lv=S.prods.filter(p=>tot[p.id]>0).map(p=>{seen.add(p.id);const e=pEnd(p,d)+push(p),a=lane(p,tot[p.id],e);out.push(...a);return{p,n:bakeN(p.id,tot[p.id]),st:a.length?a[0].st:e}});
 for(let r=0;r<4&&lv.length;r++){
  const need={};lv.forEach(({p,n,st})=>calc(p).lines.forEach(l=>{const s=subOf(l.n);if(!s||s.id==p.id||seen.has(s.id))return;const x=need[s.id]=need[s.id]||{s,q:0,end:Infinity};x.q+=l.g*n/(+s.unitG||1);x.end=Math.min(x.end,st)}));
  lv=Object.values(need).map(({s,q,end})=>{seen.add(s.id);q=Math.max(1,Math.ceil(q-1e-6));end+=Math.min(0,shf(s.id))*6e4;const a=lane(s,q,end);out.push(...a);return{p:s,n:bakeN(s.id,q),st:a.length?a[0].st:end}})}
 return out.sort((a,b)=>a.st-b.st||a.t-b.t)}
// what to buy for a day: sub-recipes expanded into raw ingredients
function need(d){const tot=totOf(d),sh={};S.prods.filter(p=>tot[p.id]>0).forEach(p=>{const n=bakeN(p.id,tot[p.id]);xl(calc(p).lines).forEach(l=>{if(!l.n||!l.g)return;const k=key(l.n);sh[k]=sh[k]||{n:l.n,g:0,u:bu(l.n)};sh[k].g+=l.g*n})});return Object.values(sh).sort((a,b)=>a.n.localeCompare(b.n))}
// Today: ingredients for jobs you start; a sub-recipe has its own job, so skip it inside the product
function needW(d){const sh={};workDay(d).ev.filter(e=>e.first&&!e.carry).forEach(e=>{const p=S.prods.find(x=>x.id==e.ps[0].id);if(!p)return;const n=bakeN(p.id,e.ps[0].q);calc(p).lines.forEach(l=>{if(!l.n||!l.g||subOf(l.n))return;const k=key(l.n);sh[k]=sh[k]||{n:l.n,g:0,u:bu(l.n)};sh[k].g+=l.g*n})});return Object.values(sh).sort((a,b)=>a.n.localeCompare(b.n))}

  :`<div class="row"><label>Recipe type${sel(P+'.mode',[['pct','Baker’s %'],['amt','Amounts']],p.mode)}</label><label>Yield by${sel(P+'.yt',[['weight','Weight per unit'],['batch','Units per batch']],p.yt)}</label><label>Weight per unit (g)${num('unitG',p.unitG)}</label>${bt?`<label>Units per batch${num('batch',p.batch)}</label>`:''}${pc&&bt?`<label>Flour per batch (g)${num('flourG',p.flourG)}</label>`:''}</div>`;
 const steps=p.steps.map((s,j)=>{const k=p.id+j,op=s.d||stN.has(k);return`<div class="row srow">${inp(`${P}.steps.${j}.n`,s.n,'grow')}${num(`steps.${j}.mins`,s.mins,'smin')}<span class="mut">min</span><button class="g sm${s.d?' on':''}" title="Instructions" aria-label="Instructions" onclick="stN.has('${k}')?stN.delete('${k}'):stN.add('${k}');draw()">✎</button><button class="g sm" onclick="del('${P}.steps',${j})" aria-label="Remove step">×</button></div>${op?`<div class="row sd"><input class="grow" placeholder="Instructions for this step" value="${esc(s.d||'')}" onchange="up('${P}.steps.${j}.d',this.value)"></div>`:''}`}).join('');
 return`<section class="ed">${bar}
 <div class="row">${inp(P+'.name',p.name,'grow big2')}</div>
 <div class="row"><label>Category${sel(P+'.cat',[['Bakery','Bakery'],['Soups','Soups'],['Drinks','Drinks'],['Other','Other']],p.cat||'Bakery')}</label><label class="chip"><input type="checkbox"${p.sub?' checked':''} onchange="setSub(${i},this.checked)"> Use in other recipes (levain, frosting…)</label></div>
 ${sell}<h4>Yield</h4>${yieldR}${p.sub?'':batchSum(p,c)}${p.sub?'':preUI(i)}
 <h4>Ingredients <span class="mut">${pc?'flour = 100%':p.sub||bt?'for one batch':'for one unit'}</span></h4>${ingEd(i)}
 <h4>Steps <span class="mut">in order, with minutes</span></h4>${steps}<div class="row qrow"><input id="rs-n" class="grow" placeholder="Add step, e.g. Proof" onkeydown="if(event.key=='Enter'){event.preventDefault();$('#rs-m').focus()}"><input id="rs-m" class="smin" type="number" step="any" placeholder="min" onkeydown="if(event.key=='Enter'){event.preventDefault();rsAdd(${i})}"><span class="mut">min</span><button class="b sm" onclick="rsAdd(${i})">Add</button></div>
 <h4>Notes for the person making it</h4><textarea rows="2" onchange="up('${P}.notes',this.value)">${esc(p.notes||'')}</textarea>
 <details class="edmore"><summary>More: labour, oven, label, photo, versions</summary>
  <div class="row"><label>${p.yt=='batch'&&!p.sub?'Labour min / batch':'Labour min / unit'}${num('lab',p.lab)}</label><label>Units per oven tray${num('tray',p.tray||0)}</label><label>Oven °C${num('temp',p.temp||0)}</label>${sv=='whole'&&!p.sub?`<label>Portions (info only)${num('por',p.por||1)}</label>`:''}</div>

  ${verUI(i)}${pNotes(p.id).length?`<details class="ver"><summary>Bake notes · ${pNotes(p.id).length}</summary>${notesList(p.id,5)}</details>`:''}

 const L=S.prods.map((p,i)=>[p,i]),main=L.filter(([p])=>!p.sub&&(pcat=='All'||(p.cat||'Bakery')==pcat)&&ok(p)),sb=L.filter(([p])=>p.sub&&ok(p));

function morph(a,b){
 if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b);return}
 if(a.nodeType===3||a.nodeType===8){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
 if(a.nodeType!==1)return;
 for(const at of [...a.attributes])if(!b.hasAttribute(at.name))a.removeAttribute(at.name);
 for(const at of [...b.attributes])if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value);
 const tg=a.tagName,act=a===document.activeElement;
 if(tg==='INPUT'){if(a.type==='checkbox'||a.type==='radio')a.checked=b.hasAttribute('checked');else if(!act&&a.type!=='file'&&a.value!==(b.getAttribute('value')||''))a.value=b.getAttribute('value')||''}
 if(tg==='TEXTAREA'){if(!act&&a.value!==b.textContent)a.value=b.textContent;return}
 if(tg==='SELECT'){const run=()=>{morphKids(a,b);const o=[...b.options].findIndex(x=>x.hasAttribute('selected'));const i=o<0?0:o;if(a.selectedIndex!==i)a.selectedIndex=i};run();return}
 if(tg==='DETAILS'){a.open=b.hasAttribute('open')}

const mkey=n=>n.nodeType===1?n.nodeName+'|'+(n.id||'')+'|'+(n.getAttribute('class')||''):n.nodeName;
// match children by kind, so one added or removed line doesn't rebuild everything after it
function morphKids(a,b){const A=[...a.childNodes],B=[...b.childNodes];let i=0;
 for(let j=0;j<B.length;j++){const nb=B[j],kb=mkey(nb);
  if(i<A.length&&mkey(A[i])===kb){morph(A[i],nb);i++;continue}
  let f=-1;for(let s=i+1;s<Math.min(A.length,i+6);s++)if(mkey(A[s])===kb){f=s;break}
  const insAhead=i<A.length&&B.slice(j+1,j+6).some(x=>mkey(x)===mkey(A[i]));
  if(f>=0&&!insAhead){for(let s=i;s<f;s++)A[s].remove();i=f;morph(A[i],nb);i++;continue}
  if(i<A.length&&!insAhead&&A[i].nodeType===nb.nodeType&&A[i].nodeName===nb.nodeName){morph(A[i],nb);i++;continue}
  a.insertBefore(nb,i<A.length?A[i]:null)}
 for(let s=i;s<A.length;s++)A[s].remove()}

// ===== Record a purchase from a link (#buy=...) =====
let buyR=null;
function buyRead(){try{const m=location.hash.match(/^#buy=([\w-]+)/);if(!m)return null;const b=m[1].replace(/-/g,'+').replace(/_/g,'/');const r=JSON.parse(decodeURIComponent(escape(atob(b+'==='.slice((b.length+3)%4)))));return r&&Array.isArray(r.lines)&&r.lines.length?r:null}catch(e){return null}}
const buyMatch=l=>{for(const n of [l.n,...(l.m||[])]){const g=S.ings.find(x=>key(x.n)==key(n));if(g)return g}return null};
function buyShow(){buyR=buyRead();const old=document.getElementById('imp');old&&old.remove();if(!buyR)return;
 buyR.lines.forEach(l=>{const g=buyMatch(l);l.g=g?g.n:null;if(l.size==null)l.size=g?g.size:1;if(!l.unit)l.unit=g?g.unit:'kg'});
 const el=document.createElement('div');el.id='imp';el.className='impbox';
 el.innerHTML=`<div class="impin"><div class="mut sm2">Record this purchase?</div><h3 style="margin:2px 0 4px">${esc(buyR.sup||'Purchase')}</h3><div class="mut sm2">${dlab(buyR.date||tdy())} · prices are per pack</div>
 ${buyR.lines.map((l,j)=>`<div class="impr"><div class="row" style="margin:0"><b class="grow">${esc(l.g||l.n)}</b>${l.g?'':'<span class="bd">new</span>'}</div><div class="row buyl" style="margin:6px 0 0"><input type="number" step="any" value="${l.packs}" aria-label="Packs" onchange="const L=buyR.lines[${j}];L.packs=+this.value||0;if(L.tot&&L.packs){L.price=Math.round(L.tot/L.packs*1000)/1000;this.parentNode.querySelector('.bpp').value=L.price}"><span class="mut">×</span><input type="number" step="any" value="${l.size}" aria-label="Pack size" onchange="buyR.lines[${j}].size=+this.value||0"><select aria-label="Unit" onchange="buyR.lines[${j}].unit=this.value">${UN.map(u=>`<option${u==l.unit?' selected':''}>${u}</option>`).join('')}</select><span class="mut">€</span><input class="bpp" type="number" step="any" value="${l.price}" aria-label="Price per pack" onchange="buyR.lines[${j}].price=+this.value||0;buyR.lines[${j}].tot=0"></div>${l.note?`<div class="mut sm2" style="margin-top:4px">${esc(l.note)}</div>`:''}</div>`).join('')}
 ${typeof sb!='undefined'&&sb&&!sbUser?`<p class="sm2 st-warn">You’re not signed in on this screen, so this would stay here and not reach your phone app. Open the link from the FOLk app, or sign in under More → Settings first.</p>`:''}
 <div class="row" style="margin-top:12px"><button class="g" onclick="impClose();buyR=null">Cancel</button><span class="grow"></span><button class="b" onclick="buySave()">Save purchase</button></div></div>`;
 document.body.appendChild(el)}
async function buySave(){const r=buyR;if(!r)return;try{if(typeof sb!='undefined'&&sb&&sbUser&&typeof pull=='function')await pull()}catch(e){}
 bF={date:r.date||tdy(),sup:r.sup||'',lines:r.lines.filter(l=>+l.packs>0&&+l.price>0).map(l=>{const g=buyMatch(l);return{n:g?g.n:l.n,packs:+l.packs,size:+l.size||1,unit:l.unit||'kg',price:+l.price}})};
 if(!bF.lines.length){flash('Nothing to save');return}
 r.lines.forEach(l=>{if(!buyMatch(l)&&l.al){S.ings.push({n:l.n,price:0,size:+l.size||1,unit:l.unit||'kg',al:l.al,waste:0})}});
 buyR=null;impClose();tab='Buy';bSave()}
window.addEventListener('hashchange',()=>{if(/^#buy=/.test(location.hash))buyShow()});
setTimeout(()=>{if(/^#buy=/.test(location.hash))buyShow()},700);


// update an existing recipe by name (from Claude), keeping the old one as a version
function impUpd(p,r,made){ensV(p);
 if(typeof r.rename=='string'&&r.rename.trim()&&r.rename.trim()!=p.name){const nn=r.rename.trim(),old=p.name;if(S.prods.some(x=>x!==p&&key(x.name)==key(nn)))throw new Error('name taken');if(p.sub)S.prods.forEach(x=>(x.ings||[]).forEach(i=>{if(key(i.n)==key(old))i.n=nn}));p.name=nn}
 if(vchg(p)){const n=nextV(p);p.vers.push({v:n,date:tdy(),note:'Before Claude’s change',data:snapR(p)});p.cv=n}
 if(Array.isArray(r.steps)&&r.steps.length)p.steps=r.steps.map(([n,mins,d])=>({n,mins,...(d?{d}:{})}));
 if(Array.isArray(r.ings)&&r.ings.length)p.ings=r.ings.map(l=>{if(subOf(l.n))return{n:subOf(l.n).name,amt:+l.a||0,pct:0,...(l.sec?{sec:l.sec}:{})};let g=null;for(const n of [l.n,...(l.m||[])]){g=S.ings.find(x=>key(x.n)==key(n));if(g)break}if(!g){g={n:l.n,price:0,size:1,unit:l.u=='each'?'each':l.u=='ml'?'l':'kg',al:l.al||[],waste:0};S.ings.push(g);made.push(l.n)}return{n:g.n,amt:+l.a||0,pct:0,...(l.sec?{sec:l.sec}:{})}});
 if(Array.isArray(r.secs)){if(r.secs.length>1)p.secs=[...r.secs];else delete p.secs}
 ['notes','store'].forEach(k=>{if(typeof r[k]=='string')p[k]=r[k]});['batch','unitG','temp','lab','shelf','tray'].forEach(k=>{if(+r[k]>0)p[k]=+r[k]});
 const n=nextV(p);p.vers.push({v:n,date:tdy(),note:r.vnote||'Changed by Claude',data:snapR(p)});p.cv=n}

// Baker mode: recipe notes and earlier bake notes on every step, and a note can be added at any step
function ckNotes(p,last,first){const E=pNotes(p.id).length;
 return`<div class="cknotes">${p.notes?`<details${last||first?' open':''}><summary>Recipe notes</summary><p class="ckn">${esc(p.notes)}</p></details>`:''}${E?`<details${last?' open':''}><summary>Notes from earlier bakes · ${E}</summary>${notesList(p.id,3)}</details>`:''}${first?'':last?`<div style="margin-top:10px">${noteBox(p.id,'ck')}</div>`:`<details><summary>Add a note</summary>${noteBox(p.id,'ck')}</details>`}</div>`}
// ===== Claude inbox: recipes and purchases Claude sends arrive here by themselves =====
let inboxCode,inboxOK=null,inboxBusy=false,inboxSeen=0;
function buyApply(r){
 bF={date:r.date||tdy(),sup:r.sup||'',lines:(r.lines||[]).filter(l=>+l.packs>0&&+l.price>0).map(l=>{const g=buyMatch(l);if(!g&&l.al)S.ings.push({n:l.n,price:0,size:+l.size||1,unit:l.unit||'kg',al:l.al,waste:0});const g2=buyMatch(l);return{n:g2?g2.n:l.n,packs:+l.packs,size:+l.size||(g2?g2.size:1),unit:l.unit||(g2?g2.unit:'kg'),price:+l.tot&&+l.packs?Math.round(l.tot/l.packs*1000)/1000:+l.price}})};
 if(!bF.lines.length)throw new Error('empty');bSave()}
function inboxToast(msg){$('#cf').innerHTML=`<div class="toast"><span>${esc(msg)}</span><button class="g" onclick="undo()">Undo</button></div>`;clearTimeout(tmr);tmr=setTimeout(()=>{$('#cf').innerHTML=''},20000)}
async function inboxCheck(){
 if(inboxBusy||typeof sb=='undefined'||!sb||!sbUser||busy())return;inboxBusy=true;
 try{
  const q=await sb.from('planner_inbox').select('id,kind,payload').is('done_at',null).order('id').limit(10);
  if(q.error){inboxOK=false;return}inboxOK=true;if(!q.data||!q.data.length)return;
  await pull();
  for(const row of q.data){
   // claim it first, so a second device that is also open doesn't add it twice
   const c=await sb.from('planner_inbox').update({done_at:new Date().toISOString()}).eq('id',row.id).is('done_at',null).select('id');
   if(c.error||!c.data||!c.data.length)continue;
   const pre=JSON.stringify(S),pv=row.payload||{};let msg='';
   try{
    if(row.kind=='add'){const R=Array.isArray(pv.recipes)?pv.recipes:[pv];if(!R.every(x=>x&&x.name&&(Array.isArray(x.ings)||x.update)))throw 0;const {made}=impApply(R);msg=`From Claude: ${R.length>1?R.length+' recipes added':R[0].update&&R[0].rename&&S.prods.some(p=>p.name==R[0].rename.trim())?R[0].name+' renamed to '+R[0].rename.trim():R[0].name+(R[0].update&&S.prods.some(p=>key(p.name)==key(R[0].name))?' updated (old one kept as a version)':' added')}${made.length?`. New: ${made.join(', ')}`:''}`}
    else if(row.kind=='buy'){buyApply(pv);msg=`From Claude: purchase from ${pv.sup||'shop'} recorded, ${pv.lines.length} item${pv.lines.length==1?'':'s'}`}
    else continue;
   }catch(e){S=JSON.parse(pre);continue}
   save();draw();lastS=pre;inboxToast(msg);inboxSeen++}
 }catch(e){}finally{inboxBusy=false}}
setInterval(()=>{if(!document.hidden)inboxCheck()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(inboxCheck,1500)});
setTimeout(inboxCheck,4000);
function inboxNewCode(){const a=new Uint8Array(18);crypto.getRandomValues(a);return'folk-'+[...a].map(b=>'abcdefghjkmnpqrstuvwxyz23456789'[b%31]).join('')}
async function inboxLoad(){if(!sb||!sbUser)return;const q=await sb.from('planner_inbox_keys').select('code').maybeSingle();if(q.error){inboxOK=false;inboxCode=null}else{inboxOK=true;inboxCode=q.data?q.data.code:null}draw()}
async function inboxMake(){if(!sb||!sbUser)return;const code=inboxNewCode();const q=await sb.from('planner_inbox_keys').upsert({owner:sbUser.id,code});if(q.error){flash('Could not save the code. Did you run the inbox setup in Supabase?');inboxOK=false;draw();return}inboxCode=code;inboxOK=true;draw();flash('Inbox code ready')}
async function inboxCopy(){try{await navigator.clipboard.writeText(inboxCode);flash('Code copied. Paste it to Claude.')}catch(e){flash('Select the code and copy it')}}
async function inboxSqlCopy(){try{const t=await (await fetch('supabase-inbox.sql',{cache:'no-store'})).text();await navigator.clipboard.writeText(t);flash('Setup copied. Paste it into Supabase → SQL Editor and press Run.')}catch(e){window.open('supabase-inbox.sql','_blank')}}
function inboxUI(){
 if(typeof sb=='undefined'||!sb||!sbUser)return'';
 if(inboxCode===undefined&&inboxOK!==false){inboxCode=null;setTimeout(inboxLoad,0)}
 const h='<h2>Claude inbox</h2>';
 if(inboxOK===false)return h+`<div class="card"><p class="mut">Lets Claude send recipes and receipts straight into your app. One-time setup in Supabase:</p><ol class="mut sm2"><li>Tap <b>Copy setup</b>.</li><li>In Supabase open <b>SQL Editor → New query</b>, paste, press <b>Run</b>.</li><li>Come back and tap <b>Check again</b>.</li></ol><div class="row"><button class="b" onclick="inboxSqlCopy()">Copy setup</button><button class="g" onclick="inboxOK=null;inboxCode=undefined;draw()">Check again</button><a class="lnk" href="supabase-inbox.sql" target="_blank">View it</a></div></div>`;
 if(!inboxCode)return h+`<div class="card"><p class="mut">Make a code and give it to Claude. With it Claude can only add items to your inbox. It can’t see your recipes, prices or orders.</p><button class="b" onclick="inboxMake()">Create inbox code</button></div>`;
 return h+`<div class="card"><p class="mut" style="margin-top:0">Give this code to Claude. What Claude sends appears here by itself when the app is open, with Undo.</p><div class="row"><code class="icode grow">${esc(inboxCode)}</code><button class="b sm" onclick="inboxCopy()">Copy</button></div><div class="row"><span class="mut sm2 grow">${inboxSeen?`${inboxSeen} item${inboxSeen==1?'':'s'} received on this device.`:'Checks every minute while the app is open.'}</span><button class="g sm" onclick="inboxCheck()">Check now</button><button class="lnk" onclick="if(confirm('Make a new code? The old one stops working.'))inboxMake()">New code</button></div></div>`}

// ===== Versions renumber 1, 2, 3… after old ones are deleted =====
function renV(p){if(!p.vers||!p.vers.length)return false;const vs=[...p.vers].sort((a,b)=>a.v-b.v);if(vs.every((x,k)=>x.v==k+1))return false;
 const map={};vs.forEach((x,k)=>map[x.v]=k+1);
 (S.notes||[]).forEach(n=>{if(n.pid==p.id&&n.v!=null)n.v=map[n.v]||0});
 p.cv=map[p.cv]||vs.length;vs.forEach(x=>x.v=map[x.v]);p.vers=vs;return true}
function delV(i,v){const p=S.prods[i];if(v==p.cv||p.vers.length<2)return;snap(`Version ${v} deleted`);p.vers=p.vers.filter(z=>z.v!=v);(S.notes||[]).forEach(n=>{if(n.pid==p.id&&n.v==v)n.v=0});renV(p);save();draw();flash(`Version ${v} deleted. Versions renumbered 1 to ${p.vers.length}`)}
function notesList(pid,max){const L=pNotes(pid).slice(0,max||50);return L.length?`<div class="nl">${L.map(n=>`<div class="ni"><div class="grow"><span class="mut">${dlab(n.date)} · ${n.v?'version '+n.v:'deleted version'}</span><div>${esc(n.t)}</div></div><button class="g sm" onclick="delNote('${n.id}')">Delete</button></div>`).join('')}</div>`:''}
(function(){let ch=false;S.prods.forEach(p=>{if(renV(p))ch=true});if(ch)save()})();
const _adoptRV=adopt;adopt=function(r,f){_adoptRV(r,f);let ch=false;S.prods.forEach(p=>{if(renV(p))ch=true});if(ch)save()};

// ===== Sales: one card per item, readable on a phone =====
function slSold(i){const m=$('#sm'+i),l=$('#sl'+i),o=$('#ss'+i);if(!m||!o)return;const mv=m.value,lv=+l.value||0;o.textContent=mv===''?'':`${Math.max((+mv||0)-lv,0)} sold`}
function slog(){
 const d=sdate||pday(),rec=S.sales[d]||{},cnt={};dOf(d).filter(o=>o.par).forEach(o=>cnt[o.pid]=(cnt[o.pid]||0)+o.qty);
 const days=Object.keys(S.sales).sort().reverse().slice(0,21);
 const rows=S.prods.map((p,i)=>{if(p.sub&&!rec[p.id])return'';const r=rec[p.id],mv=r?(r.made==null?'':r.made):(cnt[p.id]?bakeN(p.id,cnt[p.id]):''),lv=r&&r.made!=null?(+r.left||0):'';
  return`<div class="sl-row"><div class="sl-h"><b>${esc(p.name)}</b><span id="ss${i}" class="sl-s">${mv!==''?`${Math.max((+mv||0)-(+lv||0),0)} sold`:r?`${rs(r)} sold`:''}</span></div>
  <div class="sl-f"><label>Made<input id="sm${i}" type="number" min="0" inputmode="numeric" value="${mv}" oninput="slSold(${i})"></label><label>Left over<input id="sl${i}" type="number" min="0" inputmode="numeric" value="${lv}" oninput="slSold(${i})"></label><label class="sl-o"><input id="so${i}" class="ck" type="checkbox"${r&&r.out?' checked':''}>Sold out</label></div></div>`}).join('');
 return`<div class="row"><label>Day<input id="sd" type="date" value="${d}" onchange="sdate=this.value;draw()"></label></div>
 <p class="mut">Count only what you made for the counter, not customer orders. Leave an item empty if you didn’t make it. Tick “Sold out” if it ran out before closing, so the forecast knows demand was higher.</p>
 <div class="sl-list">${rows}</div>
 <div class="sl-save"><button class="b" onclick="saveDay()">Save ${dlab(d)}</button></div>
 ${days.length?`<h2>Recorded days</h2><div class="sl-days">${days.map(x=>{const v=Object.values(S.sales[x]);return`<div class="sl-day"><div class="grow"><b>${dlab(x)}</b><div class="mut">${v.reduce((a,r)=>a+rs(r),0)} sold · ${v.reduce((a,r)=>a+(+r.left||0),0)} left over</div></div><button class="g sm" onclick="sdate='${x}';draw();window.scrollTo(0,0)">Edit</button><button class="g sm" onclick="delDay('${x}')">Delete</button></div>`}).join('')}</div>`:''}
 <details class="qa"><summary>Import past sales</summary><p class="mut">Paste one line per item: date, product name, sold, and optionally made. For example: 17/10/2026, Cardamom bun, 43, 48</p><textarea id="imp" rows="5"></textarea><p><button class="b" onclick="impS()">Import</button></p></details>`}

draw();

// ===== Ask before deleting anything =====
// Every delete asks first. A delete that triggers another one (last drink size -> drink) asks once.
function askBox(t,ok,go){const o=document.getElementById('askbox');o&&o.remove();const [h,...rest]=String(t).split('\n\n');
 const el=document.createElement('div');el.id='askbox';el.className='askbg';el.innerHTML=`<div class="askin" role="alertdialog" aria-modal="true"><p class="askh">${esc(h)}</p>${rest.length?`<p class="mut">${esc(rest.join(' '))}</p>`:''}<div class="row"><button class="g grow" data-a="no">Cancel</button><button class="b grow" data-a="ok">${esc(ok)}</button></div></div>`;
 const close=()=>{el.remove();document.removeEventListener('keydown',k)},k=e=>{if(e.key=='Escape')close()};
 el.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(e.target===el||(a&&a.dataset.a=='no'))close();else if(a&&a.dataset.a=='ok'){close();go()}});
 document.addEventListener('keydown',k);document.body.appendChild(el);setTimeout(()=>{const b=el.querySelector('[data-a=no]');b&&b.focus()},30)}
(function(){let asking=false;const q=t=>`“${String(t||'').trim()||'this'}”`;
 const after={delP:()=>{vw=null;ed=null;draw()}};
 const ask=(fn,msg)=>{const f=window[fn];if(typeof f!='function')return;window[fn]=function(...a){if(asking)return f.apply(this,a);let t=null;try{t=msg(...a)}catch(e){t='Delete this?'}if(t===false)return f.apply(this,a);
  // the app's own box, not confirm(): some phones and home-screen apps silently block confirm()
  askBox(t,fn=='rst'?'Reset everything':'Delete',()=>{asking=true;try{f.apply(this,a)}finally{asking=false}after[fn]&&after[fn]()});return false}};
 ask('del',(p,i)=>{const x=at(p)[i]||{};return /steps$/.test(p)?`Remove the step ${q(x.n)}?`:`Remove ${q(x.n)} from this recipe?`});
 ask('delP',i=>`Delete the recipe ${q(S.prods[i].name)}?\n\nYou can press Undo straight after.`);
 ask('delI',i=>`Delete the ingredient ${q(S.ings[i].n)}?`);
 ask('delDay',x=>`Delete the sales recorded for ${x}?`);
 ask('delV',(i,v)=>`Delete version ${v} of ${q(S.prods[i].name)}?\n\nThe other versions get renumbered.`);
 ask('delNote',()=>'Delete this note?');
 ask('secDel',(i,k)=>`Remove the section ${q(S.prods[i].secs[k])}?\n\nIts ingredients move to the first section.`);
 ask('delG',oid=>{const o=S.orders.find(x=>x.oid==oid);return `Delete the order${o&&o.cust?' for '+o.cust:''}?`});
 ask('bRm',()=>'Remove this purchase?\n\nIngredient prices stay as they are now.');
 ask('dDel',i=>`Delete the drink ${q(S.dr.items[i].name)}?`);
 ask('dSzDel',(i,j)=>{const it=S.dr.items[i];return it.sizes.length<2?`${q(it.sizes[j].s)} is the last size, so the whole drink ${q(it.name)} will be deleted. Continue?`:`Remove the size ${q(it.sizes[j].s)}?`});
 ask('dExDel',(i,j,x)=>`Remove ${q(S.dr.items[i].sizes[j].ex[x].n)}?`);
 ask('runSet',(k,f)=>f=='del'?`Remove the running cost ${q((runL()[k]||{}).n)}?`:false);
 ask('rst',()=>`Reset EVERYTHING?\n\nAll recipes, ingredients, orders, sales and purchases will be wiped${typeof sbUser!='undefined'&&sbUser?' on all your devices':''}. Save a backup first.`);
})();
</script></body></html>
