</style></head><body>
<header><div class="top"><h1 class="wm" style="cursor:pointer" title="Home"><img class="wm-logo hdr" src="brand/folk-logo.png" alt="FOLk"><span class="wm2">Speciality Coffee</span></h1><div id="sub">Bake and cost planner</div></div>
<nav id="nav"></nav></header>
<main id="v"></main>
<script>
const $=s=>document.querySelector(s),K='folk-planner-v1';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tz=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16);
const def=()=>{const d=new Date(Date.now()+864e5);d.setHours(7,0,0,0);return{set:{biz:'FOLk Coffee',cur:'€',foot:'Made in a kitchen that also handles milk, gluten, nuts and eggs.',labor:15,ready:tz(d)},
prices:{flour:{p:1.2,a:'gluten'},water:{p:0,a:''},salt:{p:0.8,a:''},levain:{p:1,a:'gluten'}},
prods:[{id:'p1',name:'Country loaf',unitG:800,price:6,lab:10,ings:[{n:'Flour',pct:100},{n:'Water',pct:72},{n:'Salt',pct:2},{n:'Levain',pct:20}],steps:[{n:'Build levain',mins:480},{n:'Mix',mins:30},{n:'Bulk ferment',mins:240},{n:'Shape',mins:30},{n:'Cold proof',mins:720},{n:'Bake',mins:45}]}],orders:[]}};
let S,tab='Plan';
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||def();
const save=()=>{if(window.__sbReady)S._ts=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){};if(window.__sbReady&&typeof syncSoon=='function')syncSoon()};
const at=(p)=>p.split('.').reduce((o,k)=>o[k],S);
function up(p,v,num){const k=p.split('.'),l=k.pop();at(k.join('.'))[l]=num?(+v||0):v;save();draw()}
function add(p,x){at(p).push(x);save();draw()}
function del(p,i){at(p).splice(i,1);save();draw()}
function pr(n,f,v){const k=n.toLowerCase();S.prices[k]=S.prices[k]||{p:0,a:''};S.prices[k][f]=f=='p'?(+v||0):v;save();draw()}
const m=v=>S.set.cur+(+v||0).toFixed(2);
const key=n=>n.trim().toLowerCase();
function calc(p){const sum=p.ings.reduce((a,i)=>a+(+i.pct||0),0)||1;const fl=p.unitG*100/sum;
 const lines=p.ings.map(i=>({n:i.n,g:fl*(+i.pct||0)/100}));
 const ing=lines.reduce((a,l)=>a+l.g/1000*((S.prices[key(l.n)]||{}).p||0),0);
 const cost=ing+(+p.lab||0)/60*S.set.labor;
 const w=p.ings.filter(i=>/water/i.test(i.n)).reduce((a,i)=>a+(+i.pct||0),0);
 const f=p.ings.filter(i=>/flour/i.test(i.n)).reduce((a,i)=>a+(+i.pct||0),0)||100;
 return{lines,cost,ing,sum,hyd:w/f*100}}
const fm=t=>new Date(t).toLocaleString([],{weekday:'short',hour:'2-digit',minute:'2-digit'});
const inp=(p,v,cls,num)=>`<input class="${cls||''}" ${num?'type=number step=any':''} value="${esc(v)}" onchange="up('${p}',this.value,${num?1:0})">`;

function plan(){
 const q={};dO().forEach(o=>q[o.pid]=(q[o.pid]||0)+o.qty);
 const act=S.prods.filter(p=>q[p.id]>0);
 let h=`<div class="row noprint"><label>Ready at<input type="datetime-local" value="${esc(S.set.ready)}" onchange="up('set.ready',this.value)"></label><button class="b" onclick="print()">Print the whole plan</button></div>`;
 if(!act.length)return h+`<p class="mut">No orders for <b>${dlab(pday())}</b>. Add orders or daily targets on the Orders tab, or change the Ready at date above.</p>`;
 const end=new Date(S.set.ready).getTime(),ev={};
 act.forEach(p=>{let t=end;[...p.steps].reverse().forEach(s=>{const st=t-(+s.mins||0)*6e4,k=st+'|'+key(s.n)+'|'+t;(ev[k]=ev[k]||{st,t,n:s.n,ps:[]}).ps.push(p.name);t=st})});
 const rows=Object.values(ev).sort((a,b)=>a.st-b.st||a.t-b.t);
 let rev=0,cost=0,shop={};
 act.forEach(p=>{const c=calc(p);rev+=q[p.id]*p.price;cost+=q[p.id]*c.cost;c.lines.forEach(l=>{const k=key(l.n);shop[k]=shop[k]||{n:l.n,g:0};shop[k].g+=l.g*q[p.id]})});
 h+=`<p class="mut noprint">Showing orders for <b>${dlab(pday())}</b>. Change the date above to see another day.</p><div class="pt">${esc(S.set.biz)} · Production plan · ${fm(end)}</div><div class="stats card"><div><div class="big">${m(rev)}</div>Revenue</div><div><div class="big">${m(cost)}</div>Cost incl. labour</div><div><div class="big">${rev?((rev-cost)/rev*100).toFixed(0):0}%</div>Margin</div></div>`;
 h+=`<h2>Bake schedule</h2><div class="scroll"><table><tr><th>Start</th><th>Finish</th><th>Step</th><th>For</th></tr>${rows.map(r=>`<tr><td>${fm(r.st)}</td><td>${fm(r.t)}</td><td>${esc(r.n)}</td><td>${esc(r.ps.join(', '))}</td></tr>`).join('')}</table></div>`;
 h+='<h2>Scaled formulas</h2>'+act.map(p=>{const c=calc(p);return`<h4>${esc(p.name)} × ${q[p.id]} (${(q[p.id]*p.unitG/1000).toFixed(2)} kg dough, hydration ${c.hyd.toFixed(0)}%)</h4><div class="scroll"><table>${c.lines.map(l=>`<tr><td>${esc(l.n)}</td><td class="n">${Math.round(l.g*q[p.id])} g</td></tr>`).join('')}</table></div>`}).join('');
 h+=`<h2>Shopping list</h2><div class="scroll"><table>${Object.values(shop).map(s=>{const pc=((S.prices[key(s.n)]||{}).p||0)*s.g/1000;return`<tr><td>${esc(s.n)}</td><td class="n">${(s.g/1000).toFixed(2)} kg</td><td class="n">${m(pc)}</td></tr>`}).join('')}</table></div>`;
 const by={};dO().forEach(o=>(by[o.cust]=by[o.cust]||[]).push(o));
 h+='<h2>Packing lists</h2><div class="lbls">'+Object.keys(by).map(c=>`<div class="lbl"><b>${esc(c)}</b>${by[c][0].time?' · '+esc(by[c][0].time):''}<br>${by[c].map(o=>`☐ ${o.qty} × ${esc((S.prods.find(p=>p.id==o.pid)||{}).name)}${o.note?' — '+esc(o.note):''}`).join('<br>')}</div>`).join('')+'</div>';
 h+='<h2>Labels</h2><div class="lbls">'+act.map(p=>{const c=calc(p).lines.filter(l=>l.n).sort((a,b)=>b.g-a.g);const al=[...new Set(c.map(l=>(S.prices[key(l.n)]||{}).a).filter(Boolean))];
  return`<div class="lbl"><b>${esc(p.name)}</b><br>Ingredients: ${c.map(l=>esc(l.n)).join(', ')}.<br>${al.length?`<b>Contains: ${esc(al.join(', '))}</b><br>`:''}Net weight: ${p.unitG} g<br>${esc(S.set.foot)}<br><b>${esc(S.set.biz)}</b></div>`}).join('')+'</div>';
 return h}

function orders(){
 if(!S.prods.length)return'<p class="mut">Add a product first.</p>';
 let h=`<div class="card"><div class="row"><label class="grow">Customer<input id="oc"></label><label>Product<select id="op">${S.prods.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><label>Qty<input id="oq" type="number" value="1" min="1"></label><button class="b" onclick="addO()">Add order</button></div></div>`;
 h+=S.orders.length?`<div class="scroll"><table>${S.orders.map((o,i)=>`<tr><td>${esc(o.cust)}</td><td>${esc((S.prods.find(p=>p.id==o.pid)||{name:'(deleted)'}).name)}</td><td class="n">${o.qty}</td><td><button class="g" onclick="del('orders',${i})">Remove</button></td></tr>`).join('')}</table></div><p><button class="g" onclick="if(confirm('Clear all orders?')){S.orders=[];save();draw()}">Clear this week</button></p>`:'<p class="mut">No orders yet.</p>';
 return h}
function addO(){const c=$('#oc').value.trim()||'Walk-in',q=+$('#oq').value||1;add('orders',{cust:c,pid:$('#op').value,qty:q})}

function editor(i){
 return [S.prods[i]].map(p=>{const c=calc(p),P=`prods.${i}`;
 return`<section class="card"><div class="row"><button class="g" onclick="ed=null;draw()">← All products</button><span class="grow"></span><button class="g" onclick="dupP(${i})">Duplicate</button><button class="g" onclick="delP(${i})">Delete</button></div><div class="row">${inp(P+'.name',p.name,'grow big2')}</div>
 <div class="row"><label>Unit weight (g)${inp(P+'.unitG',p.unitG,'',1)}</label><label>Sell price${inp(P+'.price',p.price,'',1)}</label><label>Labour min / unit${inp(P+'.lab',p.lab,'',1)}</label></div>
 <h4>Formula in baker’s % (flour = 100)</h4>${p.ings.map((g,j)=>`<div class="row">${inp(`${P}.ings.${j}.n`,g.n,'grow')}${inp(`${P}.ings.${j}.pct`,g.pct,'',1)}<span class="mut">%</span><button class="g" onclick="del('${P}.ings',${j})">×</button></div>`).join('')}<button class="g" onclick="add('${P}.ings',{n:'',pct:0})">+ Ingredient</button>
 <h4>Steps in order, with minutes</h4>${p.steps.map((s,j)=>`<div class="row">${inp(`${P}.steps.${j}.n`,s.n,'grow')}${inp(`${P}.steps.${j}.mins`,s.mins,'',1)}<span class="mut">min</span><button class="g" onclick="del('${P}.steps',${j})">×</button></div>`).join('')}<button class="g" onclick="add('${P}.steps',{n:'',mins:30})">+ Step</button>
 <p class="mut">Total ${c.sum.toFixed(0)}% · hydration ${c.hyd.toFixed(0)}% · ingredients ${m(c.ing)} · cost with labour ${m(c.cost)} · margin ${p.price?((p.price-c.cost)/p.price*100).toFixed(0):0}%</p></section>`}).join('')}

const AL=['Celery','Gluten','Crustaceans','Eggs','Fish','Lupin','Milk','Molluscs','Mustard','Nuts','Peanuts','Sesame','Soya','Sulphites'];
const UN=['g','kg','ml','l','each'],FAC={g:1,kg:1000,ml:1,l:1000,each:1},BASE={g:'g',kg:'g',ml:'ml',l:'ml',each:'each'};
const gi=n=>S.ings.find(g=>key(g.n)==key(n));
const wf=g=>1-Math.min(+(g||{}).waste||0,90)/100;
const ppu=g=>g?(+g.price||0)/((+g.size||1)*FAC[g.unit]):0;
const bu=n=>{const g=gi(n);return g?BASE[g.unit]:'g'};

const dstr=d=>d.toLocaleDateString('en-IE');
function mig(){
 S.ings=S.ings||[];
 const seen={};S.ings.forEach(g=>seen[key(g.n)]=1);
 const nm=s=>AL.find(x=>x.toLowerCase()==s.toLowerCase())||s;
 S.prods.forEach(p=>{
  p.ings.forEach(i=>{const k=key(i.n);if(k&&!seen[k]){seen[k]=1;const x=(S.prices||{})[k]||{p:0,a:''};S.ings.push({n:i.n,price:x.p||0,size:1,unit:'kg',al:x.a?x.a.split(/[,;]\s*/).filter(Boolean).map(nm):[],waste:0})}if(i.amt==null)i.amt=0});
  p.mode=p.mode||'pct';p.yt=p.yt||'weight';p.batch=p.batch||1;p.flourG=p.flourG||1000;p.shelf=p.shelf||3;if(p.store==null)p.store='Keep in a cool, dry place.'});
 const s=S.set;s.addr=s.addr||'';s.may=s.may||'May contain traces of nuts, milk, gluten, eggs and soya.';s.margin=s.margin||65;
 S.lab=S.lab||{pid:'all',copies:0,size:'a8',made:new Date().toISOString().slice(0,10),code:'',price:false};
}
mig();save();
function calc(p){
 const b=Math.max(+p.batch||1,1),pc=p.mode=='pct',sum=p.ings.reduce((a,i)=>a+(+i.pct||0),0)||1;
 const f=pc?(p.yt=='batch'?(+p.flourG||0)/b:p.unitG*100/sum):1;
 const lines=p.ings.map(i=>({n:i.n,g:pc?f*(+i.pct||0)/100:(+i.amt||0)/(p.yt=='batch'?b:1)}));
 const ing=lines.reduce((a,l)=>{const g=gi(l.n);return a+l.g*ppu(g)/wf(g)},0);
 const cost=ing+(+p.lab||0)/60*S.set.labor;
 const w=lines.filter(l=>/water/i.test(l.n)).reduce((a,l)=>a+l.g,0),fl=lines.filter(l=>/flour/i.test(l.n)).reduce((a,l)=>a+l.g,0);
 return{lines,cost,ing,sum,hyd:fl?w/fl*100:0}}
function newP(){S.prods.push({id:nid(),name:'New product',unitG:100,price:0,lab:0,mode:'amt',yt:'batch',batch:1,flourG:1000,shelf:3,store:'Keep in a cool, dry place.',ings:[{n:(S.ings[0]||{n:''}).n,pct:100,amt:0}],steps:[{n:'Make',mins:30},{n:'Bake',mins:30}]});ed=S.prods.length-1;save();draw()}
function pickI(i,j,v){if(v=='__new'){const n='New ingredient '+(S.ings.length+1);S.ings.push({n,price:0,size:1,unit:'kg',al:[],waste:0});S.prods[i].ings[j].n=n;tab='Ingredients'}else S.prods[i].ings[j].n=v;save();draw()}
function editor(i){
 const p=S.prods[i],c=calc(p),P=`prods.${i}`,pc=p.mode=='pct',bt=p.yt=='batch';
 const opts=v=>S.ings.map(g=>`<option${key(g.n)==key(v)?' selected':''}>${esc(g.n)}</option>`).join('');

 return`<section class="card"><div class="row"><button class="g" onclick="ed=null;draw()">← All products</button><button class="g" onclick="ed=null;vw=${i};draw()">View recipe</button><span class="grow"></span><button class="g" onclick="dupP(${i})">Duplicate</button><button class="g" onclick="delP(${i})">Delete</button></div>
 <div class="row">${inp(P+'.name',p.name,'grow big2')}</div>
 <div class="row">${p.img?`<img class="ph" src="${p.img}" alt="">`:''}<label class="chip">Photo<input type="file" accept="image/*" onchange="photo(${i},this)"></label>${p.img?`<button class="g" onclick="up('prods.${i}.img','')">Remove photo</button>`:''}</div>
 ${verUI(i)}${pNotes(p.id).length?`<details class="ver"><summary>Bake notes · ${pNotes(p.id).length}</summary>${notesList(p.id,5)}</details>`:''}<div class="row"><label>Category${sel(P+'.cat',[['Bakery','Bakery'],['Drinks','Drinks'],['Other','Other']],p.cat||'Bakery')}</label><label>Recipe type${sel(P+'.mode',[['pct','Baker’s %'],['amt','Amounts']],p.mode)}</label><label>Yield defined by${sel(P+'.yt',[['weight','Weight per unit'],['batch','Units per batch']],p.yt)}</label></div>
 <div class="row"><label>Net weight per unit (g)${inp(P+'.unitG',p.unitG,'',1)}</label>${bt?`<label>Units per batch${inp(P+'.batch',p.batch,'',1)}</label>`:''}${pc&&bt?`<label>Flour per batch (g)${inp(P+'.flourG',p.flourG,'',1)}</label>`:''}<label>Sell price${inp(P+'.price',p.price,'',1)}</label><label>Portions per unit${inp(P+'.por',p.por||1,'',1)}</label><label>Price per portion${inp(P+'.sp',p.sp||0,'',1)}</label><label>Labour min / unit${inp(P+'.lab',p.lab,'',1)}</label><label>Units per oven tray${inp(P+'.tray',p.tray||0,'',1)}</label><label>Oven °C${inp(P+'.temp',p.temp||0,'',1)}</label></div>
 <h4>Ingredients ${pc?'(flour = 100%)':bt?'(amounts for one batch)':'(amounts for one unit)'}</h4>
 ${p.ings.map((g,j)=>`<div class="row"><select class="grow" onchange="pickI(${i},${j},this.value)">${opts(g.n)}</select>${inp(`${P}.ings.${j}.${pc?'pct':'amt'}`,pc?g.pct:g.amt,'',1)}<span class="mut">${pc?'%':bu(g.n)}</span><button class="g" onclick="del('${P}.ings',${j})">×</button></div>`).join('')}
 ${p.ings.length?'':'<p class="mut">No ingredients yet. Add them below.</p>'}<datalist id="ingl">${S.ings.map(g=>`<option value="${esc(g.n)}">`).join('')}</datalist>
 <div class="row qrow"><input id="ri-n" class="grow" list="ingl" placeholder="Add ingredient: type to search" oninput="riU(this.value,${pc})" onkeydown="if(event.key=='Enter'){event.preventDefault();$('#ri-a').focus()}"><input id="ri-a" type="number" step="any" placeholder="${pc?'%':'amount'}" onkeydown="if(event.key=='Enter'){event.preventDefault();riAdd(${i})}"><span class="mut" id="ri-u">${pc?'%':''}</span><button class="b sm" onclick="riAdd(${i})">Add</button></div>
 <h4>Steps in order, with minutes</h4>${p.steps.map((s,j)=>`<div class="row">${inp(`${P}.steps.${j}.n`,s.n,'grow')}${inp(`${P}.steps.${j}.mins`,s.mins,'',1)}<span class="mut">min</span><button class="g" onclick="del('${P}.steps',${j})">×</button></div><div class="row"><input class="grow" placeholder="Instructions for this step (optional)" value="${esc(s.d||'')}" onchange="up('${P}.steps.${j}.d',this.value)"></div>`).join('')}<div class="row qrow"><input id="rs-n" class="grow" placeholder="Add step, e.g. Proof" onkeydown="if(event.key=='Enter'){event.preventDefault();$('#rs-m').focus()}"><input id="rs-m" type="number" step="any" placeholder="min" onkeydown="if(event.key=='Enter'){event.preventDefault();rsAdd(${i})}"><span class="mut">min</span><button class="b sm" onclick="rsAdd(${i})">Add</button></div>
 <h4>Notes for the person making it</h4><textarea rows="3" onchange="up('${P}.notes',this.value)">${esc(p.notes||'')}</textarea>
 <h4>Label</h4><div class="row"><label>Shelf life (days)${inp(P+'.shelf',p.shelf,'',1)}</label><label class="grow">Storage advice${inp(P+'.store',p.store)}</label></div>
 <p class="mut">Ingredients ${m(c.ing)} · cost with labour ${m(c.cost)} · margin ${p.price?((p.price-c.cost)/p.price*100).toFixed(0):0}% · price for ${+S.set.margin||0}% margin: ${m(sug)}${por(p)>1?' · '+pinfo(p):''}${c.hyd?` · hydration ${c.hyd.toFixed(0)}%`:''}</p><div class="row" style="margin-top:14px"><button class="b" onclick="edDone(${i})">Done</button><span class="mut">Changes save automatically as you type.</span></div></section>`}

function newI(){S.ings.push({n:'New ingredient',price:0,size:1,unit:'kg',al:[],waste:0});save();draw();const c=document.querySelectorAll('#v section.card'),x=c[c.length-1];if(x){const i=x.querySelector('input');i.scrollIntoView({block:'center'});i.focus();i.select()}}

function ingredients(){
 return`<div class="row"><h2 class="grow" style="margin:0">Ingredients</h2></div><p class="mut">Enter what you buy: pack price, pack size and unit. Recipes pick from this list, and changing a price updates every recipe.</p>`+(S.ings.length?S.ings.map((g,i)=>{const pp=ppu(g),u=BASE[g.unit];return`<section class="card"><div class="row"><label class="grow">Name<input value="${esc(g.n)}" onchange="rn(${i},this.value)"></label><label>Pack price${inp(`ings.${i}.price`,g.price,'',1)}</label><label>Pack size${inp(`ings.${i}.size`,g.size,'',1)}</label><label>Unit${sel(`ings.${i}.unit`,UN.map(x=>[x,x]),g.unit)}</label><label>Waste %${inp(`ings.${i}.waste`,g.waste,'',1)}</label></div><p class="mut">${u=='each'?m(pp)+' each':m(pp*1000)+' per '+(u=='g'?'kg':'l')} · used in ${used(g.n)} product(s)</p><details><summary>Allergens${g.al.length?': '+esc(g.al.join(', ')):' (none)'}</summary><div class="chips">${AL.map(a=>`<label class="chip"><input type="checkbox"${g.al.includes(a)?' checked':''} onchange="tg(${i},'${a}',this)"> ${a}</label>`).join('')}</div></details><p><button class="g" onclick="delI(${i})">Delete</button></p></section>`}).join(''):'<p class="mut">No ingredients yet. Add the ones you buy.</p>')+'<p><button class="b" onclick="newI()">+ New ingredient</button></p>'}

function plan(){
 const q={};dO().forEach(o=>q[o.pid]=(q[o.pid]||0)+o.qty);
 const act=S.prods.filter(p=>q[p.id]>0);
 let h=`<div class="row noprint"><label>Ready at<input type="datetime-local" value="${esc(S.set.ready)}" onchange="up('set.ready',this.value)"></label><button class="b" onclick="print()">Print the whole plan</button></div>`;
 if(!act.length)return h+`<p class="mut">No orders for <b>${dlab(pday())}</b>. Add orders or daily targets on the Orders tab, or change the Ready at date above.</p>`;
 const bs=p=>Math.max(+p.batch||1,1),bq=p=>p.yt=='batch'?Math.ceil(q[p.id]/bs(p))*bs(p):q[p.id];
 const end=new Date(S.set.ready).getTime(),ev={};
 act.forEach(p=>{let t=end;[...p.steps].reverse().forEach(s=>{const st=t-(+s.mins||0)*6e4,k=st+'|'+key(s.n)+'|'+t;(ev[k]=ev[k]||{st,t,n:s.n,ps:[]}).ps.push(p.name);t=st})});
 const rows=Object.values(ev).sort((a,b)=>a.st-b.st||a.t-b.t);
 let rev=0,cost=0,tot=0,shop={};
 act.forEach(p=>{const c=calc(p);rev+=q[p.id]*p.price;cost+=q[p.id]*c.cost;c.lines.forEach(l=>{const k=key(l.n),g=gi(l.n),x=l.g*bq(p);shop[k]=shop[k]||{n:l.n,g:0,u:bu(l.n),c:0};shop[k].g+=x;shop[k].c+=x*ppu(g)/wf(g)})});
 Object.values(shop).forEach(s=>tot+=s.c);
 h+=`<p class="mut noprint">Showing orders for <b>${dlab(pday())}</b>. Change the date above to see another day.</p><div class="pt">${esc(S.set.biz)} · Production plan · ${fm(end)}</div><div class="stats card"><div><div class="big">${m(rev)}</div>Revenue</div><div><div class="big">${m(cost)}</div>Cost incl. labour</div><div><div class="big">${rev?((rev-cost)/rev*100).toFixed(0):0}%</div>Margin</div></div>`;
 h+=`<h2>Bake schedule</h2><div class="scroll"><table><tr><th>Start</th><th>Finish</th><th>Step</th><th>For</th></tr>${rows.map(r=>`<tr><td>${fm(r.st)}</td><td>${fm(r.t)}</td><td>${esc(r.n)}</td><td>${esc(r.ps.join(', '))}</td></tr>`).join('')}</table></div>`;
 h+='<h2>Scaled formulas</h2>'+act.map(p=>{const c=calc(p),n=bq(p);return`<h4>${esc(p.name)} × ${q[p.id]}${n>q[p.id]?` — bake ${n} (${n/bs(p)} batches, ${n-q[p.id]} extra)`:''}</h4><div class="scroll"><table>${c.lines.map(l=>`<tr><td>${esc(l.n)}</td><td class="n">${fq(l.g*n,bu(l.n))}</td></tr>`).join('')}</table></div>${c.hyd?`<p class="mut">Hydration ${c.hyd.toFixed(0)}%</p>`:''}`}).join('');
 const sl=Object.values(shop).map(s=>({...s,sup:sg(s.n).sup||''})).sort((a,b)=>a.sup.localeCompare(b.sup)||a.n.localeCompare(b.n)),hs=sl.some(s=>s.sup);
 h+=`<h2>Shopping list</h2><div class="scroll"><table><tr><th>Item</th>${hs?'<th>Supplier</th>':''}<th class="n">Amount</th><th class="n">Cost</th></tr>${sl.map(s=>`<tr><td>${esc(s.n)}</td>${hs?`<td>${esc(s.sup)}</td>`:''}<td class="n">${fq(s.g,s.u)}</td><td class="n">${m(s.c)}</td></tr>`).join('')}<tr><th>Total</th>${hs?'<th></th>':''}<th></th><th class="n">${m(sl.reduce((a,s)=>a+s.c,0))}</th></tr></table></div>`;
 const by={};dO().forEach(o=>(by[o.cust]=by[o.cust]||[]).push(o));
 h+='<h2>Packing lists</h2><div class="lbls">'+Object.keys(by).map(c=>`<div class="lbl"><b>${esc(c)}</b>${by[c][0].time?' · '+esc(by[c][0].time):''}<br>${by[c].map(o=>`☐ ${o.qty} × ${esc((S.prods.find(p=>p.id==o.pid)||{}).name)}${o.note?' — '+esc(o.note):''}`).join('<br>')}</div>`).join('')+'</div>';
 return h}

 <label class="chip"><input type="checkbox"${L.price?' checked':''} onchange="S.lab.price=this.checked;save();draw()"> Show price</label></div>

const rs=r=>r.made==null&&r.sold!=null?+r.sold:Math.max((+r.made||0)-(+r.left||0),0);
const rdem=r=>r.out?Math.max(rs(r),+r.made||0)*1.15:rs(r);
const hist=pid=>Object.keys(S.sales).filter(d=>S.sales[d][pid]).sort().map(d=>({d,r:S.sales[d][pid]}));
function fcast(pid,date){
 const H=hist(pid).filter(h=>h.d<date),wd=dow(date),same=H.filter(h=>dow(h.d)==wd).slice(-8),n=same.length;
 let avg=0,ws=0;same.forEach((h,k)=>{avg+=rdem(h.r)*(k+1);ws+=k+1});if(ws)avg/=ws;
 const plain=n?same.reduce((a,h)=>a+rs(h.r),0)/n:0;
 const ly=addD(date,-364),win=(a,b)=>H.filter(h=>h.d>=addD(ly,a)&&h.d<=addD(ly,b)).map(h=>rdem(h.r)),av=x=>x.reduce((a,b)=>a+b,0)/x.length;
 const A=win(-14,14),B=win(-70,-15);let sea=1;if(A.length>=5&&B.length>=5&&av(B)>0)sea=Math.min(1.6,Math.max(.6,av(A)/av(B)));
 const adj=1+(+S.adj[date]||0)/100,rec=n?Math.ceil(avg*sea*adj*(1+(+S.set.buf||0)/100)):0;
 return{n,avg,plain,sea,adj,rec,outs:same.filter(h=>h.r.out).length,vals:same.map(h=>rs(h.r))}}

function dOf(d){
 const r=S.orders.filter(o=>o.date==d);
 S.prods.forEach(p=>{let q=+((S.par||{})[p.id]||{})[dow(d)]||0,c='Counter (daily target)';
  if(S.set.useFc&&S.sales){const f=fcast(p.id,d);if(f.n>=3){q=f.rec;c='Counter (forecast)'}}
  if(q>0)r.push({cust:c,pid:p.id,qty:q,date:d,par:true})});
 return r}
const totOf=d=>{const t={};dOf(d).forEach(o=>t[o.pid]=(t[o.pid]||0)+o.qty);return t};
function sched(d){
 const tot=totOf(d),end=endOf(d),ev={};
 S.prods.filter(p=>tot[p.id]>0).forEach(p=>{let t=end;[...p.steps].reverse().forEach(s=>{const st=t-(+s.mins||0)*6e4,k=st+'|'+key(s.n)+'|'+t;(ev[k]=ev[k]||{k,st,t,n:s.n,ps:[]}).ps.push({id:p.id,name:p.name,q:tot[p.id]});t=st})});
 return Object.values(ev).sort((a,b)=>a.st-b.st||a.t-b.t)}
function need(d){const tot=totOf(d),sh={};S.prods.filter(p=>tot[p.id]>0).forEach(p=>{const n=bakeN(p.id,tot[p.id]);calc(p).lines.forEach(l=>{if(!l.n||!l.g)return;const k=key(l.n);sh[k]=sh[k]||{n:l.n,g:0,u:bu(l.n)};sh[k].g+=l.g*n})});return Object.values(sh).sort((a,b)=>a.n.localeCompare(b.n))}
function setHave(i,v){const x=need(pday())[i];if(x){S.have[pday()+'|'+key(x.n)]=v;save();draw()}}

// oven
const isBake=s=>/bake|oven|pec/i.test(s.n||'');
function oven(d){
 const tot=totOf(d),cap=Math.max(+S.set.trays||1,1),miss=[],grp={};
 S.prods.filter(p=>tot[p.id]>0).forEach(p=>{const b=[...p.steps].reverse().find(isBake);if(!b)return;if(!(+p.tray>0)){miss.push(p.name);return}const n=bakeN(p.id,tot[p.id]);(grp[+p.temp||0]=grp[+p.temp||0]||[]).push({p,tr:Math.ceil(n/p.tray),mins:+b.mins||0})});
 const loads=[];Object.keys(grp).sort((a,b)=>b-a).forEach(t=>{let cur=null;grp[t].sort((a,b)=>b.mins-a.mins).forEach(x=>{let left=x.tr;while(left>0){if(!cur||cur.used>=cap){cur={t:+t,used:0,mins:0,items:[]};loads.push(cur)}const put=Math.min(left,cap-cur.used);cur.used+=put;cur.mins=Math.max(cur.mins,x.mins);cur.items.push({name:x.p.name,tr:put});left-=put}})});
 const totm=loads.reduce((a,l)=>a+l.mins,0)+Math.max(loads.length-1,0)*(+S.set.chg||0);
 return{loads,totm,extra:Math.max(0,totm-Math.max(0,...loads.map(l=>l.mins))),miss,cap}}
function ovenHTML(d){
 const o=oven(d);if(!o.loads.length&&!o.miss.length)return'';
 const end=endOf(d),ch=+S.set.chg||0;let t=end-o.totm*6e4;
 const rows=o.loads.map((l,k)=>{const s=t;t+=(l.mins+ch)*6e4;return`<tr><td>Load ${k+1}</td><td>${hh(s)}–${hh(s+l.mins*6e4)}</td><td>${l.t?l.t+' °C':''}</td><td class="wrap">${l.items.map(x=>`${x.tr} tray${x.tr>1?'s':''} ${esc(x.name)}`).join(', ')}</td></tr>`}).join('');
 return`<h2>Oven</h2><p>${o.loads.length>1?`Needs <b>${o.loads.length} loads</b> (${o.cap} trays at a time), about ${hm(o.totm)} of baking. Start the first load at <b>${hh(end-o.totm*6e4)}</b>, ${hm(o.extra)} earlier than the bake times in the schedule.`:o.loads.length?'Everything fits in one load.':''}</p>${rows?`<div class="scroll"><table>${rows}</table></div>`:''}${o.miss.length?`<p class="mut">Set “units per oven tray” on: ${o.miss.map(esc).join(', ')}.</p>`:''}`}

// money
function money(d){
 const tot={},ord={};dOf(d).forEach(o=>{tot[o.pid]=(tot[o.pid]||0)+o.qty;if(!o.par)ord[o.pid]=(ord[o.pid]||0)+o.qty});
 let rev=0,cost=0,waste=0,guess=false;
 S.prods.filter(p=>tot[p.id]>0).forEach(p=>{const n=bakeN(p.id,tot[p.id]),uc=calc(p).cost,o=ord[p.id]||0,c=n-o,f=fcast(p.id,d);let sell=c;if(c>0){if(f.n>=3)sell=Math.min(c,Math.round(f.avg*f.sea*f.adj));else guess=true}rev+=(o+sell)*(+p.price||0);cost+=n*uc;waste+=(c-sell)*uc});
 return{rev,cost,profit:rev-cost,waste,guess}}
function waste28(){const from=addD(tdy(),-28),pc={};Object.keys(S.sales).filter(d=>d>=from).forEach(d=>Object.entries(S.sales[d]).forEach(([id,r])=>{const p=S.prods.find(x=>x.id==id);if(p&&+r.left>0)pc[p.name]=(pc[p.name]||0)+(+r.left)*calc(p).cost}));const top=Object.entries(pc).map(([n,c])=>({n,c})).sort((a,b)=>b.c-a.c);return{tot:top.reduce((a,x)=>a+x.c,0),top:top.slice(0,3)}}

function sample(){const t=tdy();S.prods.forEach((p,k)=>{const base=8+(k*7)%15;for(let i=1;i<=56;i++){const d=addD(t,-i),f=[.8,.7,.8,.9,1.2,1.6,1.3][dow(d)],dm=Math.round(base*f*(.85+Math.random()*.3)),made=Math.round(base*f*1.05);(S.sales[d]=S.sales[d]||{})[p.id]={made,left:Math.max(made-dm,0),out:dm>=made,s:1}}});save();draw();flash('Sample sales added')}

function fview(){

 :`<div class="card"><p class="chalk">No sales recorded yet</p><p class="mut">At the end of each day, record what you made and what was left over (the Sales tab, or “Record sales” on Today). After two or three weeks the forecast starts to work.</p>${smp?'':`<button class="g" onclick="sample()">Try it with sample sales</button>`}</div>`}
 ${H.length&&no.length?`<p class="mut">No ${DNL[wd]} sales recorded yet for: ${no.map(r=>esc(r.p.name)).join(', ')}.</p>`:''}
 ${w.tot>0.005?`<h2>Leftovers, last 4 weeks</h2><p>Unsold items cost you about <b>${m(w.tot)}</b>${w.top.length?`, mostly ${w.top.map(x=>`${esc(x.n)} (${m(x.c)})`).join(', ')}`:''}.</p>`:''}
 ${smp?`<p><button class="g sm" onclick="unsample()">Remove sample sales</button></p>`:''}`}

function tone(n,f){if(muted||!actx)return;try{for(let i=0;i<n;i++){const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+i*.45;o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.5,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.35);o.start(t);o.stop(t+.4)}}catch(e){}}

function sched(d){
 const tot=totOf(d),end=endOf(d),out=[];
 S.prods.filter(p=>tot[p.id]>0).forEach(p=>{let t=end;const a=[];for(let j=p.steps.length-1;j>=0;j--){const s=p.steps[j],st=t-(+s.mins||0)*6e4;a.unshift({k:p.id+'#'+j,j,st,t,n:s.n||'Step '+(j+1),dsc:s.d||'',ps:[{id:p.id,name:p.name,q:tot[p.id]}]});t=st}out.push(...a)});
 return out.sort((a,b)=>a.st-b.st||a.t-b.t)}
const PAL=['#69504c','#a9b79f','#d9c39b','#8e9aa3','#c98f6f','#000000','#b5a8c9'];
const pcol=pid=>PAL[Math.max(0,S.prods.findIndex(p=>p.id==pid))%PAL.length];
const kOpen=new Set(),kShut=new Set();
function kTog(pid,all){const s=all?kOpen:kShut;s.has(pid)?s.delete(pid):s.add(pid);draw()}
function kSet(k,n,auto){
 const d=pday(),E=sched(d),e=E.find(x=>x.k==k);if(!e)return;
 const M=S.kb[d]=S.kb[d]||{};S.kbt=S.kbt||{};const T=S.kbt[d]=S.kbt[d]||{};
 M[k]=n;if(n==1)T[k]={s:Date.now(),x:0};else delete T[k];
 if(n==2&&auto){const nx=E.find(x=>x.ps[0].id==e.ps[0].id&&x.j==e.j+1);if(nx&&!M[nx.k]){M[nx.k]=1;T[nx.k]={s:Date.now(),x:0};flash(`${nx.n} started`)}}
 if(!Object.keys(T).length)delete S.kbt[d];
 kAl=kAl.filter(a=>a.k!=k);rAlm();save();draw()}
function kPlus(ev,k,min){ev.stopPropagation();const d=pday(),T=S.kbt&&S.kbt[d]&&S.kbt[d][k];if(T){T.x=(+T.x||0)+min;kAl=kAl.filter(a=>a.k!=k);rAlm();save();draw()}}
function kitchen(){
 const d=pday(),E=sched(d),M=S.kb[d]||{},TT=(S.kbt||{})[d]||{},now=Date.now(),st=e=>M[e.k]||0;
 const lanes=[];E.forEach(e=>{let L=lanes.find(l=>l.id==e.ps[0].id);if(!L){L={id:e.ps[0].id,name:e.ps[0].name,q:bakeN(e.ps[0].id,e.ps[0].q),steps:[]};lanes.push(L)}L.steps.push(e)});
 lanes.forEach(L=>{L.steps.sort((a,b)=>a.j-b.j);L.done=L.steps.filter(e=>st(e)==2).length;L.all=L.done==L.steps.length;L.cur=L.steps.find(e=>st(e)!=2);L.busy=!L.all&&(L.done>0||L.steps.some(e=>st(e)==1))});
 const active=lanes.filter(L=>L.busy).sort((a,b)=>a.cur.st-b.cur.st),wait=lanes.filter(L=>!L.busy&&!L.all).sort((a,b)=>a.cur.st-b.cur.st),fin=lanes.filter(L=>L.all);
 const doing=E.filter(e=>st(e)==1),nextUp=[...active,...wait].map(L=>L.cur).filter(e=>st(e)==0).sort((a,b)=>a.st-b.st)[0];

 const stepRow=(L,e)=>{const s=st(e),isCur=e==L.cur,late=s==0&&isCur&&e.st<now;
  if(s==2)return`<div class="ks done" onclick="kSet('${e.k}',0)" title="Tap to undo"><span class="ki">✓</span><span class="grow">${esc(e.n)}</span><span class="mut">undo</span></div>`;

  return`<section class="lane${L.busy?' on':''}${L.all?' fin':''}" style="--lc:${col}"><div class="ln-h" onclick="kTog('${L.id}',${L.all})"><div class="grow"><div class="ln-n">${esc(L.name)} <span class="ln-q">× ${L.q}</span></div><div class="ln-s">${stx} · ${L.done} of ${L.steps.length}</div></div>${L.all?'':`<button class="g sm" onclick="event.stopPropagation();goCook(${S.prods.findIndex(p=>p.id==L.id)})">Cook mode</button>`}<span class="ln-c">${open?'▴':'▾'}</span></div><div class="ln-bar"><i style="width:${L.done/L.steps.length*100}%"></i></div>${open?`<div class="ln-b">${laneIng(L)}${L.steps.map(e=>stepRow(L,e)).join('')}${L.all?noteBox(L.id,'kb'):`<details class="qa ln-note"><summary>Add a bake note</summary>${noteBox(L.id,'kb')}</details>`}</div>`:''}</section>`};
 return`<div class="row kh"><div class="grow"><div class="mut">Kitchen board</div><h2 class="dayh">${dlab(d)}</h2></div><div class="kclock">${hh(now)}</div></div>
 <div class="row">${kbig?'<button class="g" onclick="kBig(false)">Exit big screen</button>':'<button class="b" onclick="kBig(true)">Big screen</button><button class="g sm" onclick="shd(-1)">← Previous</button><button class="g sm" onclick="shd(0)">Today</button><button class="g sm" onclick="shd(1)">Next →</button>'}<button class="g sm" onclick="setMute(${!muted})">${muted?'Sound off':'Sound on'}</button><span class="grow"></span><span class="mut">${dn} of ${total} steps done</span><button class="g sm" onclick="kreset()">Reset</button></div>
 ${E.length?`<div class="bar"><i style="width:${total?dn/total*100:0}%"></i></div>
 <div class="know">${doing.length?doing.map(e=>`<div class="kn1" style="--lc:${pcol(e.ps[0].id)}"><span class="mut">Doing</span> <b>${esc(e.n)}</b> · ${esc(e.ps[0].name)} ${timer(e)}</div>`).join(''):''}${nextUp?`<div class="kn1 nx" style="--lc:${pcol(nextUp.ps[0].id)}"><span class="mut">Next</span> <b>${esc(nextUp.n)}</b> · ${esc(nextUp.ps[0].name)} <span class="mut">at ${hh(nextUp.st)}</span></div>`:''}${!doing.length&&!nextUp?'<div class="kn1"><b>All done for this day.</b></div>':''}</div>
 <div class="lanes">${[...active,...wait].map(lane).join('')}</div>
 ${fin.length?`<h3 class="fin-h">Finished · ${fin.length}</h3><div class="lanes">${fin.map(lane).join('')}</div>`:''}
 <p class="mut">Press Start to begin a step and its timer. Done finishes it and starts the next step. You’ll hear an alarm when a timer ends and when a step is due. Tap the screen once so sound can play, and keep this screen open.</p>`
 :'<div class="card"><p class="chalk">Nothing on the board</p><p class="mut">Add orders or daily targets for this day.</p></div>'}`}

// ===== Weighing checklist (cook mode) and bake notes =====
const wck=new Set();
function wTog(pid,j){const k=pid+'|'+j;wck.has(k)?wck.delete(k):wck.add(k);draw()}
function wList(p,c,n){
 const L=c.lines.map((l,j)=>({...l,j})).filter(l=>l.n&&l.g>0),one=!!S.set.oneBowl,done=L.filter(l=>wck.has(p.id+'|'+l.j)).length;let run=0;
 return`<div class="mut">Making ${n} × ${esc(p.name)}</div><div class="row" style="margin:4px 0 0"><h2 class="ck1 grow" style="margin:0">Weigh</h2><label class="chip"><input type="checkbox"${one?' checked':''} onchange="S.set.oneBowl=this.checked;save();draw()"> One bowl totals</label></div>
 <div class="mut">${done} of ${L.length} weighed · tap each one when it’s in</div>
 <div class="wl">${L.map(l=>{const on=wck.has(p.id+'|'+l.j),u=bu(l.n),g=l.g*n;if(u!='each')run+=g;return`<button class="wi${on?' on':''}" onclick="wTog('${p.id}',${l.j})"><span class="wb">${on?'✓':''}</span><span class="grow wn">${esc(l.n)}</span><span class="wq">${fq(g,u)}</span>${one&&u!='each'?`<span class="wr">bowl ≈ ${fq(run,'g')}</span>`:''}</button>`}).join('')}</div>
 ${L.length&&done==L.length?'<p class="wdone">✓ Everything weighed. Press Next for the first step.</p>':''}`}

// bake notes
const pNotes=pid=>(S.notes||[]).filter(n=>n.pid==pid);
function addNote(pid,el){const x=document.getElementById(el),t=(x&&x.value||'').trim();if(!t){flash('Write a note first');x&&x.focus();return}const p=S.prods.find(q=>q.id==pid);S.notes=S.notes||[];S.notes.unshift({id:nid(),pid,date:pday(),v:p&&p.cv||1,t});save();draw();flash('Note saved')}
function delNote(id){snap('Note deleted');S.notes=(S.notes||[]).filter(n=>n.id!=id);save();draw()}
function noteBox(pid,tag){const id='nt-'+tag+'-'+pid;return`<div class="nbox"><b>Bake note</b> <span class="mut">How did it go? e.g. oven ran hot, proof took longer.</span><div class="row"><input id="${id}" class="grow" placeholder="Note for next time" onkeydown="if(event.key=='Enter')addNote('${pid}','${id}')"><button class="b sm" onclick="addNote('${pid}','${id}')">Save note</button></div></div>`}

function wTog(pid,j){S.wk=S.wk||{};const W=S.wk[pday()]=S.wk[pday()]||{},k=pid+'|'+j;if(W[k])delete W[k];else W[k]=1;save();draw()}

 const L=calc(p).lines.map((l,j)=>({...l,j})).filter(l=>l.n&&l.g>0),one=!!S.set.oneBowl;let run=0;
 return{L,done:L.filter(l=>wIs(p.id,l.j)).length,html:L.map(l=>{const on=wIs(p.id,l.j),u=bu(l.n),g=l.g*n;if(u!='each')run+=g;return`<button class="wi ${cls||''}${on?' on':''}" onclick="event.stopPropagation();wTog('${p.id}',${l.j})"><span class="wb">${on?'✓':''}</span><span class="grow wn">${esc(l.n)}</span><span class="wq">${fq(g,u)}</span>${one&&u!='each'?`<span class="wr">bowl ≈ ${fq(run,'g')}</span>`:''}</button>`}).join('')}}

 return`<div class="mut">Making ${n} × ${esc(p.name)}</div><div class="row" style="margin:4px 0 0"><h2 class="ck1 grow" style="margin:0">Weigh</h2><label class="chip"><input type="checkbox"${S.set.oneBowl?' checked':''} onchange="S.set.oneBowl=this.checked;save();draw()"> One bowl totals</label></div>
 <div class="mut">${r.done} of ${r.L.length} weighed · tap each one when it’s in</div><div class="wl">${r.html}</div>
 ${r.L.length&&r.done==r.L.length?'<p class="wdone">✓ Everything weighed. Press Next for the first step.</p>':''}`}
const kIng=new Map();

 const p=S.prods.find(x=>x.id==L.id);if(!p)return'';const r=wRows(p,L.q,'wsm');if(!r.L.length)return'';
 const open=kIng.has(L.id)?kIng.get(L.id):(!L.all&&L.done==0)||(r.done>0&&r.done<r.L.length);
 return`<details class="ln-ing"${open?' open':''} ontoggle="kIngT('${L.id}',this.open)"><summary><b>Ingredients</b> <span class="mut">for ${L.q} · ${r.done} of ${r.L.length} weighed</span></summary><div class="wl">${r.html}</div></details>`}
function kreset(){snap('Board reset');const d=pday();delete S.kb[d];if(S.kbt)delete S.kbt[d];if(S.wk)delete S.wk[d];kAl=[];rAlm();save();draw()}

// ===== Shopping list (printable on its own) =====
let shopDays=1;
function shopping(){
 const d0=pday(),days=[...Array(shopDays)].map((_,k)=>addD(d0,k)),agg={};
 days.forEach(d=>need(d).forEach(x=>{const k=key(x.n);agg[k]=agg[k]||{n:x.n,g:0,u:x.u};agg[k].g+=x.g}));
 const rows=Object.values(agg).map(x=>{const g=gi(x.n)||{},pb=(+g.size||1)*(FAC[g.unit]||1),packs=g.unit&&+g.price>0?Math.ceil(x.g/(wf(g)||1)/pb-1e-9):0;return{...x,sup:g.sup||'',packs,ps:g.unit?`${+g.size||1} ${g.unit}`:'',cost:packs*(+g.price||0),use:x.g*ppu(g)/(wf(g)||1)}});
 const sups=[...new Set(rows.map(r=>r.sup))].sort((a,b)=>(a?0:1)-(b?0:1)||a.localeCompare(b));
 const tot=rows.reduce((a,r)=>a+r.cost,0),use=rows.reduce((a,r)=>a+r.use,0);
 const range=days.length>1?`${dlab(days[0])} – ${dlab(days[days.length-1])}`:dlab(d0);
 return`<div class="noprint"><div class="row"><h2 class="grow" style="margin:0">Shopping list</h2><button class="b" onclick="print()">Print shopping list</button></div>
 <div class="row"><button class="g sm" onclick="shd(-1)">← Previous</button><button class="g sm" onclick="shd(0)">Today</button><button class="g sm" onclick="shd(1)">Next →</button><label>Days to cover<select onchange="shopDays=+this.value;draw()">${[1,2,3,5,7].map(n=>`<option value="${n}"${n==shopDays?' selected':''}>${n==1?'Just this day':n+' days'}</option>`).join('')}</select></label></div>
 <p class="mut">Everything needed for ${range}, from your orders and daily targets, grouped by supplier. Packs are rounded up to whole packs, including any waste % you set. Items with no price, like water, show only the amount.</p></div>
 <div class="shop"><div class="pw"><img class="wm-logo" src="${LOGO()}" alt="FOLk"><span class="wm2">Speciality Coffee</span></div><h2 class="shop-h">Shopping list · ${range}</h2>
 ${rows.length?sups.map(sp=>`<h3>${esc(sp||'No supplier set')}</h3><table class="shop-t"><tr><th></th><th>Item</th><th class="n">Needed</th><th class="n">Buy</th><th class="n">Cost</th></tr>${rows.filter(r=>r.sup==sp).sort((a,b)=>a.n.localeCompare(b.n)).map(r=>`<tr><td class="cb">☐</td><td>${esc(r.n)}</td><td class="n">${fq(r.g,r.u)}</td><td class="n">${r.packs?`${r.packs} × ${esc(r.ps)}`:'—'}</td><td class="n">${r.packs?m(r.cost):''}</td></tr>`).join('')}</table>`).join('')+`<p class="shop-tot">Total for whole packs: <b>${m(tot)}</b> <span class="mut">· used in the bake: ${m(use)}</span></p>`
 :'<p class="chalk">Nothing to buy</p><p class="mut">Add orders or daily targets for these days.</p>'}</div>`}
G.find(g=>g[0]=='Print')[1].splice(1,0,'Shop');TL.Shop='Shopping list';T.Shop=shopping;

function labels(){
 const L=S.lab,q={};dO().forEach(o=>q[o.pid]=(q[o.pid]||0)+o.qty);L.style=L.style||'table';
 if(S.set.tag==null)S.set.tag='Made to share';

 const made=new Date(L.made+'T12:00'),code=L.code||L.made.replace(/-/g,'').slice(2);
 const info=p=>{const c=calc(p).lines.filter(l=>l.n&&l.g>0).sort((a,b)=>b.g-a.g),A=n=>(gi(n)||{al:[]}).al;return{c,A,al:[...new Set(c.flatMap(l=>A(l.n)))],bb:new Date(made.getTime()+(+p.shelf||0)*864e5)}};

 const table=p=>{const{c,A,al,bb}=info(p);return`<div class="lb lt"><div class="lt-in"><div class="lt-top"><img class="lt-logo" src="${LOGO()}" alt="FOLk"></div><div class="lt-name">${esc(p.name)}</div><div class="lt-sub">NET ${p.unitG} G${S.set.tag?' · '+esc(S.set.tag.toUpperCase()):''}${L.price?' · '+m(p.price):''}</div><div>${ingTxt(c,A)}.</div>${al.length?`<div class="lt-b">Contains ${esc(al.join(', ').toLowerCase())}.</div>`:''}${S.set.may?`<div class="lt-m">${esc(S.set.may)}</div>`:''}${p.store?`<div class="lt-m">${esc(p.store)}</div>`:''}<div class="lt-ft"><span>BAKED ${dshort(made)} · ${esc(code)}</span><b>BEST BEFORE ${dshort(bb)}</b></div><div class="lt-biz">${esc(S.set.biz)}${S.set.addr?' · '+esc(S.set.addr):''}</div></div></div>`};
 const tag=p=>{const{c,A,al,bb}=info(p);return`<div class="tg"><div class="tg-f"><i class="tg-h"></i><img class="tg-logo" src="${LOGO()}" alt="FOLk"><span class="tg-sc">Speciality Coffee</span><span class="tg-n">${esc(p.name)}</span>${S.set.tag?`<span class="tg-t">${esc(S.set.tag)}</span>`:''}</div><div class="tg-b"><i class="tg-h"></i><div>${ingTxt(c,A)}.</div>${al.length?`<div class="lt-b">Contains ${esc(al.join(', ').toLowerCase())}.</div>`:''}${S.set.may?`<div class="lt-m">${esc(S.set.may)}</div>`:''}<div class="tg-d">Net ${p.unitG} g${L.price?' · '+m(p.price):''}<br><b>Best before ${dshort(bb)}</b><br>Baked ${dshort(made)} · ${esc(code)}</div><div class="tg-th">${esc(S.set.thanks||'See you at the table')}</div><div class="lt-biz">${esc(S.set.biz)}${S.set.addr?' · '+esc(S.set.addr):''}</div></div></div>`};
 const one=L.style=='tag'?tag:L.style=='table'?table:classic;
 const sheet=list.flatMap(p=>Array(Math.max(+L.copies||q[p.id]||1,1)).fill(one(p))).join('');
 return`<div class="noprint"><div class="row"><h2 class="grow" style="margin:0">Labels</h2><button class="b" onclick="print()">Print labels</button></div>
 <div class="card"><div class="row"><label>Style${sel('lab.style',[['table','Shop label'],['tag','Swing tag'],['classic','Classic']],L.style)}</label><label>Product<select onchange="up('lab.pid',this.value)"><option value="all"${L.pid=='all'?' selected':''}>All products for this day</option>${S.prods.map(p=>`<option value="${p.id}"${L.pid==p.id?' selected':''}>${esc(p.name)}</option>`).join('')}</select></label>
 <label>Copies each (0 = ordered qty)${inp('lab.copies',L.copies,'',1)}</label>${L.style=='tag'?'':`<label>Label size${sel('lab.size',[['roll','Roll 100 × 62 mm'],['a8','A4 sheet, 8 labels'],['a21','A4 sheet, 21 labels']],L.size)}</label>`}</div>
 <div class="row"><label>Baked on<input type="date" value="${esc(L.made)}" onchange="up('lab.made',this.value)"></label><label>Batch code${inp('lab.code',L.code)}</label>${L.style!='classic'?`<label class="grow">Small line under the name${inp('set.tag',S.set.tag)}</label>`:''}${L.style=='tag'?`<label class="grow">Thank-you line on the back${inp('set.thanks',S.set.thanks==null?'See you at the table':S.set.thanks)}</label>`:''}<label class="chip"><input type="checkbox"${L.price?' checked':''} onchange="S.lab.price=this.checked;save();draw()"> Show price</label></div>
 ${S.set.addr?'':'<p class="mut"><b>Add your shop address</b> in Settings so it prints on every label.</p>'}
 <p class="mut">Best before is the baked date plus the shelf life set on each product. In the print dialog, choose your paper size, set margins to none, and print on cream or kraft paper.${L.style=='tag'?' Swing tags print 6 per A4 sheet: print on cream or kraft card, cut along the outline, fold along the dashed line and punch the marked hole.':''} Check labelling rules with the FSAI or your local environmental health officer before selling.</p></div>`+(list.length?`<div class="lsheet"><div class="lg ${L.style=='tag'?'tags':L.size}">${sheet}</div></div>`:'<p class="mut">Nothing to print. Add orders, or choose a product.</p>')}

function logoUp(el){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{if(f.type=='image/svg+xml'||f.size<250000){S.set.logo=r.result;save();setLogo();draw();flash('Logo updated');return}const im=new Image();im.onload=()=>{const k=Math.min(1,320/im.height),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.set.logo=c.toDataURL('image/png');save();setLogo();draw();flash('Logo updated')};im.src=r.result};r.readAsDataURL(f);el.value=''}
