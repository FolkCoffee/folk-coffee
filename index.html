</style></head><body>
<header><div class="top"><h1 class="wm" style="cursor:pointer" title="Home"><img class="wm-logo hdr" src="brand/folk-logo.png" alt="FOLk"><span class="wm2">Speciality Coffee</span></h1><div id="sub">Bake and cost planner</div></div>
<nav id="nav"></nav></header>
<main id="v"></main>
<script>
const $=s=>document.querySelector(s),K='folk-planner-v1';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tz=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16);
const def=()=>{const d=new Date(Date.now()+864e5);d.setHours(7,0,0,0);return{set:{biz:'FOLk Coffee',cur:'€',foot:'Made in a kitchen that also handles milk, gluten, nuts and eggs.',labor:15,ready:tz(d)},
prices:{flour:{p:1.2,a:'gluten'},water:{p:0,a:''},salt:{p:0.8,a:''},levain:{p:1,a:'gluten'}},
prods:[{id:'p1',name:'Country loaf',unitG:800,price:6,lab:10,ings:[{n:'Flour',pct:100},{n:'Water',pct:72},{n:'Salt',pct:2},{n:'Levain',pct:20}],steps:[{n:'Build levain',mins:480},{n:'Mix',mins:30},{n:'Bulk ferment',mins:240},{n:'Shape',mins:30},{n:'Cold proof',mins:720},{n:'Bake',mins:45}]}],orders:[]}};
let S,tab='Plan';
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||def();
const save=()=>{if(window.__sbReady)S._ts=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){};if(window.__sbReady&&typeof syncSoon=='function')syncSoon()};
const at=(p)=>p.split('.').reduce((o,k)=>o[k],S);
function up(p,v,num){const k=p.split('.'),l=k.pop();at(k.join('.'))[l]=num?(+v||0):v;save();draw()}
function add(p,x){at(p).push(x);save();draw()}
function del(p,i){at(p).splice(i,1);save();draw()}
function pr(n,f,v){const k=n.toLowerCase();S.prices[k]=S.prices[k]||{p:0,a:''};S.prices[k][f]=f=='p'?(+v||0):v;save();draw()}
const m=v=>S.set.cur+(+v||0).toFixed(2);
const key=n=>n.trim().toLowerCase();
function calc(p){const sum=p.ings.reduce((a,i)=>a+(+i.pct||0),0)||1;const fl=p.unitG*100/sum;
 const lines=p.ings.map(i=>({n:i.n,g:fl*(+i.pct||0)/100}));
 const ing=lines.reduce((a,l)=>a+l.g/1000*((S.prices[key(l.n)]||{}).p||0),0);
 const cost=ing+(+p.lab||0)/60*S.set.labor;
 const w=p.ings.filter(i=>/water/i.test(i.n)).reduce((a,i)=>a+(+i.pct||0),0);
 const f=p.ings.filter(i=>/flour/i.test(i.n)).reduce((a,i)=>a+(+i.pct||0),0)||100;
 return{lines,cost,ing,sum,hyd:w/f*100}}
const fm=t=>new Date(t).toLocaleString([],{weekday:'short',hour:'2-digit',minute:'2-digit'});
const inp=(p,v,cls,num)=>`<input class="${cls||''}" ${num?'type=number step=any':''} value="${esc(v)}" onchange="up('${p}',this.value,${num?1:0})">`;

function plan(){
 const q={};dO().forEach(o=>q[o.pid]=(q[o.pid]||0)+o.qty);
 const act=S.prods.filter(p=>q[p.id]>0);
 let h=`<div class="row noprint"><label>Ready at<input type="datetime-local" value="${esc(S.set.ready)}" onchange="up('set.ready',this.value)"></label><button class="b" onclick="print()">Print the whole plan</button></div>`;
 if(!act.length)return h+`<p class="mut">No orders for <b>${dlab(pday())}</b>. Add orders or daily targets on the Orders tab, or change the Ready at date above.</p>`;
 const end=new Date(S.set.ready).getTime(),ev={};
 act.forEach(p=>{let t=end;[...p.steps].reverse().forEach(s=>{const st=t-(+s.mins||0)*6e4,k=st+'|'+key(s.n)+'|'+t;(ev[k]=ev[k]||{st,t,n:s.n,ps:[]}).ps.push(p.name);t=st})});
 const rows=Object.values(ev).sort((a,b)=>a.st-b.st||a.t-b.t);
 let rev=0,cost=0,shop={};
 act.forEach(p=>{const c=calc(p);rev+=q[p.id]*p.price;cost+=q[p.id]*c.cost;(typeof xl=='function'?xl(c.lines):c.lines).forEach(l=>{const k=key(l.n);shop[k]=shop[k]||{n:l.n,g:0};shop[k].g+=l.g*q[p.id]})});
 h+=`<p class="mut noprint">Showing orders for <b>${dlab(pday())}</b>. Change the date above to see another day.</p><div class="pt">${esc(S.set.biz)} · Production plan · ${fm(end)}</div><div class="stats card"><div><div class="big">${m(rev)}</div>Revenue</div><div><div class="big">${m(cost)}</div>Cost incl. labour</div><div><div class="big">${rev?((rev-cost)/rev*100).toFixed(0):0}%</div>Margin</div></div>`;
 h+=`<h2>Bake schedule</h2><table class="stab"><tr><th>When</th><th>Step</th></tr>${rows.map(r=>`<tr><td class="nw">${fm(r.st)}–${hh(r.t)}</td><td><b>${esc(r.n)}</b><div class="mut">${esc(r.ps.join(', '))}</div></td></tr>`).join('')}</table>`;
 h+='<h2>Scaled formulas</h2>'+act.map(p=>{const c=calc(p);return`<h4>${esc(p.name)} × ${q[p.id]} (${(q[p.id]*p.unitG/1000).toFixed(2)} kg dough, hydration ${c.hyd.toFixed(0)}%)</h4><div class="scroll"><table>${c.lines.map(l=>`<tr><td>${esc(l.n)}</td><td class="n">${Math.round(l.g*q[p.id])} g</td></tr>`).join('')}</table></div>`}).join('');
 h+=`<h2>Shopping list</h2><div class="scroll"><table>${Object.values(shop).map(s=>{const pc=((S.prices[key(s.n)]||{}).p||0)*s.g/1000;return`<tr><td>${esc(s.n)}</td><td class="n">${(s.g/1000).toFixed(2)} kg</td><td class="n">${m(pc)}</td></tr>`}).join('')}</table></div>`;
 const by={};dO().forEach(o=>(by[o.cust]=by[o.cust]||[]).push(o));
 h+='<h2>Packing lists</h2><div class="lbls">'+Object.keys(by).map(c=>`<div class="lbl"><b>${esc(c)}</b>${by[c][0].time?' · '+esc(by[c][0].time):''}<br>${by[c].map(o=>`☐ ${o.qty} × ${esc((S.prods.find(p=>p.id==o.pid)||{}).name)}${o.note?' — '+esc(o.note):''}`).join('<br>')}</div>`).join('')+'</div>';
 h+='<h2>Labels</h2><div class="lbls">'+act.map(p=>{const c=calc(p).lines.filter(l=>l.n).sort((a,b)=>b.g-a.g);const al=[...new Set(c.map(l=>(S.prices[key(l.n)]||{}).a).filter(Boolean))];
  return`<div class="lbl"><b>${esc(p.name)}</b><br>Ingredients: ${c.map(l=>esc(l.n)).join(', ')}.<br>${al.length?`<b>Contains: ${esc(al.join(', '))}</b><br>`:''}Net weight: ${p.unitG} g<br>${esc(S.set.foot)}<br><b>${esc(S.set.biz)}</b></div>`}).join('')+'</div>';
 return h}

function orders(){
 if(!S.prods.length)return'<p class="mut">Add a product first.</p>';
 let h=`<div class="card"><div class="row"><label class="grow">Customer<input id="oc"></label><label>Product<select id="op">${S.prods.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><label>Qty<input id="oq" type="number" value="1" min="1"></label><button class="b" onclick="addO()">Add order</button></div></div>`;
 h+=S.orders.length?`<div class="scroll"><table>${S.orders.map((o,i)=>`<tr><td>${esc(o.cust)}</td><td>${esc((S.prods.find(p=>p.id==o.pid)||{name:'(deleted)'}).name)}</td><td class="n">${o.qty}</td><td><button class="g" onclick="del('orders',${i})">Remove</button></td></tr>`).join('')}</table></div><p><button class="g" onclick="if(confirm('Clear all orders?')){S.orders=[];save();draw()}">Clear this week</button></p>`:'<p class="mut">No orders yet.</p>';
 return h}
function addO(){const c=$('#oc').value.trim()||'Walk-in',q=+$('#oq').value||1;add('orders',{cust:c,pid:$('#op').value,qty:q})}

function editor(i){
 return [S.prods[i]].map(p=>{const c=calc(p),P=`prods.${i}`;
 return`<section class="card"><div class="row"><button class="g" onclick="ed=null;draw()">← All products</button><span class="grow"></span><button class="g" onclick="dupP(${i})">Duplicate</button><button class="g" onclick="delP(${i})">Delete</button></div><div class="row">${inp(P+'.name',p.name,'grow big2')}</div>
 <div class="row"><label>Unit weight (g)${inp(P+'.unitG',p.unitG,'',1)}</label><label>Sell price${inp(P+'.price',p.price,'',1)}</label><label>Labour min / unit${inp(P+'.lab',p.lab,'',1)}</label></div>
 <h4>Formula in baker’s % (flour = 100)</h4>${p.ings.map((g,j)=>`<div class="row">${inp(`${P}.ings.${j}.n`,g.n,'grow')}${inp(`${P}.ings.${j}.pct`,g.pct,'',1)}<span class="mut">%</span><button class="g" onclick="del('${P}.ings',${j})">×</button></div>`).join('')}<button class="g" onclick="add('${P}.ings',{n:'',pct:0})">+ Ingredient</button>
 <h4>Steps in order, with minutes</h4>${p.steps.map((s,j)=>`<div class="row">${inp(`${P}.steps.${j}.n`,s.n,'grow')}${inp(`${P}.steps.${j}.mins`,s.mins,'',1)}<span class="mut">min</span><button class="g" onclick="del('${P}.steps',${j})">×</button></div>`).join('')}<button class="g" onclick="add('${P}.steps',{n:'',mins:30})">+ Step</button>
 <p class="mut">Total ${c.sum.toFixed(0)}% · hydration ${c.hyd.toFixed(0)}% · ingredients ${m(c.ing)} · cost with labour ${m(c.cost)} · margin ${p.price?((p.price-c.cost)/p.price*100).toFixed(0):0}%</p></section>`}).join('')}
let ed=null;
const nid=()=>'p'+Date.now()+Math.random().toString(36).slice(2,5);
function newP(){S.prods.push({id:nid(),name:'New product',unitG:500,price:0,lab:0,ings:[{n:'Flour',pct:100}],steps:[{n:'Mix',mins:30},{n:'Bake',mins:30}]});ed=S.prods.length-1;save();draw()}
function dupP(i){const c=JSON.parse(JSON.stringify(S.prods[i]));c.id=nid();c.name+=' (copy)';S.prods.splice(i+1,0,c);ed=i+1;save();draw()}
function delP(i){if(!confirm('Delete "'+S.prods[i].name+'"? Existing orders for it will show as deleted.'))return;S.prods.splice(i,1);ed=null;save();draw()}
function prods(){
 if(ed!=null&&S.prods[ed])return editor(ed);
 const cards=S.prods.map((p,i)=>{const c=calc(p),mg=p.price?(p.price-c.cost)/p.price*100:0;return`<article class="box"><h3>${esc(p.name)}</h3><p class="mut">${p.unitG} g · ${p.ings.length} ingredients · ${p.steps.length} steps</p><div class="kv"><span>Price<b>${m(p.price)}</b></span><span>Cost<b>${m(c.cost)}</b></span><span>Margin<b>${mg.toFixed(0)}%</b></span></div><div class="row"><button class="b" onclick="ed=${i};draw()">Edit</button><button class="g" onclick="dupP(${i})">Duplicate</button><button class="g" onclick="delP(${i})">Delete</button></div></article>`}).join('');
 return`<div class="row"><h2 class="grow" style="margin:0">Products</h2><button class="b" onclick="newP()">+ New product</button></div><div class="grid">${cards}<button class="box add" onclick="newP()">+<br>Add product</button></div>`}

function tools(){
 return`<div class="card"><h3>Dough temperature</h3><p class="mut">Water temperature that hits your target dough temperature (°C).</p><div class="row"><label>Target${tn('t1',24)}</label><label>Flour${tn('t2',20)}</label><label>Room${tn('t3',22)}</label><label>Levain${tn('t4',24)}</label><label>Friction${tn('t5',0)}</label></div><p class="big" id="r1"></p></div>
 <div class="card"><h3>Levain builder</h3><p class="mut">Starter : flour : water ratio.</p><div class="row"><label>Levain needed (g)${tn('l1',200)}</label><label>Starter${tn('l2',1)}</label><label>Flour${tn('l3',5)}</label><label>Water${tn('l4',5)}</label></div><p id="r2"></p></div>`}
const tn=(id,v)=>`<input id="${id}" type="number" value="${v}" oninput="tl()">`;
function tl(){const g=i=>+$('#'+i).value||0;
 $('#r1').textContent=(3*g('t1')-g('t2')-g('t3')-g('t4')-g('t5')).toFixed(1)+' °C water';
 const s=g('l2')+g('l3')+g('l4')||1,t=g('l1');
 $('#r2').textContent=`Starter ${Math.round(t*g('l2')/s)} g · flour ${Math.round(t*g('l3')/s)} g · water ${Math.round(t*g('l4')/s)} g`}

function settings(){
 const names={};S.prods.forEach(p=>p.ings.forEach(i=>{if(i.n.trim())names[key(i.n)]=i.n}));
 return`<div class="card"><div class="row"><label class="grow">Business name${inp('set.biz',S.set.biz)}</label><label>Currency${inp('set.cur',S.set.cur)}</label><label>Labour rate / hour${inp('set.labor',S.set.labor,'',1)}</label></div><label>Label footer${inp('set.foot',S.set.foot)}</label></div>
 <h2>Ingredient prices and allergens</h2><div class="scroll"><table><tr><th>Ingredient</th><th>Price per kg</th><th>Allergen</th></tr>${Object.keys(names).map(k=>{const x=S.prices[k]||{p:0,a:''},n=esc(names[k]).replace(/'/g,'&#39;');return`<tr><td>${esc(names[k])}</td><td><input type=number step=any value="${x.p}" onchange="pr('${n}','p',this.value)"></td><td><input value="${esc(x.a)}" placeholder="e.g. milk" onchange="pr('${n}','a',this.value)"></td></tr>`}).join('')}</table></div>
 <h2>Backup</h2><p class="mut">Data is stored only in this browser. Copy the text below to keep a backup, or paste a backup and load it.</p><textarea id="bk" rows="5">${esc(JSON.stringify(S))}</textarea><p><button class="b" onclick="try{S=JSON.parse($('#bk').value);save();draw()}catch(e){alert('That backup could not be read.')}">Load backup</button> <button class="g" onclick="if(confirm('Reset everything?')){S=def();save();draw()}">Reset</button></p>`}

const AL=['Celery','Gluten','Crustaceans','Eggs','Fish','Lupin','Milk','Molluscs','Mustard','Nuts','Peanuts','Sesame','Soya','Sulphites'];
const UN=['g','kg','ml','l','each'],FAC={g:1,kg:1000,ml:1,l:1000,each:1},BASE={g:'g',kg:'g',ml:'ml',l:'ml',each:'each'};
const gi=n=>(typeof srIng=='function'&&srIng(n))||S.ings.find(g=>key(g.n)==key(n));
const wf=g=>1-Math.min(+(g||{}).waste||0,90)/100;
const ppu=g=>g?(+g.price||0)/((+g.size||1)*FAC[g.unit]):0;
const bu=n=>{const g=gi(n);return g?BASE[g.unit]:'g'};
const fq=(v,u)=>u=='each'?(Math.round(v*10)/10)+' pcs':v>=1000?(v/1000).toFixed(2)+(u=='g'?' kg':' l'):Math.round(v)+' '+u;
const sel=(p,o,v)=>`<select onchange="up('${p}',this.value)">${o.map(x=>`<option value="${x[0]}"${x[0]==v?' selected':''}>${x[1]}</option>`).join('')}</select>`;
const dstr=d=>d.toLocaleDateString('en-IE');
function mig(){
 S.ings=S.ings||[];
 const seen={};S.ings.forEach(g=>seen[key(g.n)]=1);
 const nm=s=>AL.find(x=>x.toLowerCase()==s.toLowerCase())||s;
 S.prods.forEach(p=>{
  p.ings.forEach(i=>{const k=key(i.n);if(k&&!seen[k]){seen[k]=1;const x=(S.prices||{})[k]||{p:0,a:''};S.ings.push({n:i.n,price:x.p||0,size:1,unit:'kg',al:x.a?x.a.split(/[,;]\s*/).filter(Boolean).map(nm):[],waste:0})}if(i.amt==null)i.amt=0});
  p.mode=p.mode||'pct';p.yt=p.yt||'weight';p.batch=p.batch||1;p.flourG=p.flourG||1000;p.shelf=p.shelf||3;if(p.store==null)p.store='Keep in a cool, dry place.'});
 const s=S.set;s.addr=s.addr||'';s.may=s.may||'May contain traces of nuts, milk, gluten, eggs and soya.';s.margin=s.margin||65;
 S.lab=S.lab||{pid:'all',copies:0,size:'a8',made:new Date().toISOString().slice(0,10),code:'',price:false};
}
mig();save();
function calc(p){
 const b=Math.max(+p.batch||1,1),pc=p.mode=='pct',sum=p.ings.reduce((a,i)=>a+(+i.pct||0),0)||1;
 const f=pc?(p.yt=='batch'?(+p.flourG||0)/b:p.unitG*100/sum):1;
 const lines=p.ings.map(i=>({n:i.n,g:pc?f*(+i.pct||0)/100:(+i.amt||0)/(p.yt=='batch'?b:1)}));
 const ing=lines.reduce((a,l)=>{const g=gi(l.n);return a+l.g*ppu(g)/wf(g)},0);
 const cost=ing+(+p.lab||0)/60*S.set.labor;
 const w=lines.filter(l=>/water/i.test(l.n)).reduce((a,l)=>a+l.g,0),fl=lines.filter(l=>/flour/i.test(l.n)).reduce((a,l)=>a+l.g,0);
 return{lines,cost,ing,sum,hyd:fl?w/fl*100:0}}
function newP(){S.prods.push({id:nid(),name:'New product',unitG:100,price:0,lab:0,mode:'amt',yt:'batch',batch:1,flourG:1000,shelf:3,store:'Keep in a cool, dry place.',ings:[{n:(S.ings[0]||{n:''}).n,pct:100,amt:0}],steps:[{n:'Make',mins:30},{n:'Bake',mins:30}]});ed=S.prods.length-1;save();draw()}
function pickI(i,j,v){if(v=='__new'){const n='New ingredient '+(S.ings.length+1);S.ings.push({n,price:0,size:1,unit:'kg',al:[],waste:0});S.prods[i].ings[j].n=n;tab='Ingredients'}else S.prods[i].ings[j].n=v;save();draw()}
function editor(i){
 const p=S.prods[i],c=calc(p),P=`prods.${i}`,pc=p.mode=='pct',bt=p.yt=='batch';
 const opts=v=>S.ings.filter(g=>!(typeof subOf=='function'&&subOf(g.n))).map(g=>`<option${key(g.n)==key(v)?' selected':''}>${esc(g.n)}</option>`).join('')+((S.prods.filter(x=>x.sub&&x.id!=S.prods[i].id)).map(x=>`<option${key(x.name)==key(v)?' selected':''}>${esc(x.name)}</option>`).join(''));
 const sug=Math.ceil(c.cost/(1-Math.min(+S.set.margin||0,95)/100)*20)/20;
 return`<section class="card"><div class="row"><button class="g" onclick="ed=null;draw()">← All products</button><button class="g" onclick="ed=null;vw=${i};draw()">View recipe</button><span class="grow"></span><button class="g" onclick="dupP(${i})">Duplicate</button><button class="g" onclick="delP(${i})">Delete</button></div>
 <div class="row">${inp(P+'.name',p.name,'grow big2')}</div>
 <div class="row">${p.img?`<img class="ph" src="${p.img}" alt="">`:''}<label class="chip">Photo<input type="file" accept="image/*" onchange="photo(${i},this)"></label>${p.img?`<button class="g" onclick="up('prods.${i}.img','')">Remove photo</button>`:''}</div>
 ${verUI(i)}${pNotes(p.id).length?`<details class="ver"><summary>Bake notes · ${pNotes(p.id).length}</summary>${notesList(p.id,5)}</details>`:''}<div class="row"><label>Category${sel(P+'.cat',[['Bakery','Bakery'],['Drinks','Drinks'],['Other','Other']],p.cat||'Bakery')}</label><label>Recipe type${sel(P+'.mode',[['pct','Baker’s %'],['amt','Amounts']],p.mode)}</label><label>Yield defined by${sel(P+'.yt',[['weight','Weight per unit'],['batch','Units per batch']],p.yt)}</label></div>

function plan(){

 if(!act.length)return h+`<p class="mut">No orders for <b>${dlab(pday())}</b>. Add orders or daily targets on the Orders tab, or change the Ready at date above.</p>`;
 const bs=p=>Math.max(+p.batch||1,1),bq=p=>p.yt=='batch'?Math.ceil(q[p.id]/bs(p))*bs(p):q[p.id];
 const end=new Date(S.set.ready).getTime(),ev={};
 act.forEach(p=>{let t=pEnd(p,pday());[...p.steps].reverse().forEach(s=>{const st=t-(+s.mins||0)*6e4,k=st+'|'+key(s.n)+'|'+t;(ev[k]=ev[k]||{st,t,n:s.n,ps:[]}).ps.push(p.name);t=st})});

 let rev=0,cost=0,tot=0,shop={};
 act.forEach(p=>{const c=calc(p);rev+=q[p.id]*p.price;cost+=q[p.id]*c.cost;(typeof xl=='function'?xl(c.lines):c.lines).forEach(l=>{const k=key(l.n),g=gi(l.n),x=l.g*bq(p);shop[k]=shop[k]||{n:l.n,g:0,u:bu(l.n),c:0};shop[k].g+=x;shop[k].c+=x*ppu(g)/wf(g)})});
 Object.values(shop).forEach(s=>tot+=s.c);
 h+=`<p class="mut noprint">Showing orders for <b>${dlab(pday())}</b>. Change the date above to see another day.</p><div class="pt">${esc(S.set.biz)} · Production plan · ${fm(end)}</div><div class="stats card"><div><div class="big">${m(rev)}</div>Revenue</div><div><div class="big">${m(cost)}</div>Cost incl. labour</div><div><div class="big">${rev?((rev-cost)/rev*100).toFixed(0):0}%</div>Margin</div></div>`;

 h+='<h2>Scaled formulas</h2>'+act.map(p=>{const c=calc(p),n=bq(p);return`<h4>${esc(p.name)} × ${q[p.id]}${n>q[p.id]?` — bake ${n} (${n/bs(p)} batches, ${n-q[p.id]} extra)`:''}</h4><div class="scroll"><table>${c.lines.map(l=>`<tr><td>${esc(l.n)}</td><td class="n">${fq(l.g*n,bu(l.n))}</td></tr>`).join('')}</table></div>${c.hyd?`<p class="mut">Hydration ${c.hyd.toFixed(0)}%</p>`:''}`}).join('');
 const sl=Object.values(shop).map(s=>({...s,sup:sg(s.n).sup||''})).sort((a,b)=>a.sup.localeCompare(b.sup)||a.n.localeCompare(b.n)),hs=sl.some(s=>s.sup);
 h+=`<h2>Shopping list</h2><div class="scroll"><table><tr><th>Item</th>${hs?'<th>Supplier</th>':''}<th class="n">Amount</th><th class="n">Cost</th></tr>${sl.map(s=>`<tr><td>${esc(s.n)}</td>${hs?`<td>${esc(s.sup)}</td>`:''}<td class="n">${fq(s.g,s.u)}</td><td class="n">${m(s.c)}</td></tr>`).join('')}<tr><th>Total</th>${hs?'<th></th>':''}<th></th><th class="n">${m(sl.reduce((a,s)=>a+s.c,0))}</th></tr></table></div>`;
 const by={};dO().forEach(o=>(by[o.cust]=by[o.cust]||[]).push(o));
 h+='<h2>Packing lists</h2><div class="lbls">'+Object.keys(by).map(c=>`<div class="lbl"><b>${esc(c)}</b>${by[c][0].time?' · '+esc(by[c][0].time):''}<br>${by[c].map(o=>`☐ ${o.qty} × ${esc((S.prods.find(p=>p.id==o.pid)||{}).name)}${o.note?' — '+esc(o.note):''}`).join('<br>')}</div>`).join('')+'</div>';
 return h}

const addD=(d,k)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+k);return x.toISOString().slice(0,10)};

// sales records: {made, left, out} or imported {sold, made:null}
const rs=r=>r.made==null&&r.sold!=null?+r.sold:Math.max((+r.made||0)-(+r.left||0),0);
const rdem=r=>r.out?Math.max(rs(r),+r.made||0)*1.15:rs(r);

function fcast(pid,date){
 const H=hist(pid).filter(h=>h.d<date),wd=dow(date),same=H.filter(h=>dow(h.d)==wd).slice(-8),n=same.length;
 let avg=0,ws=0;same.forEach((h,k)=>{avg+=rdem(h.r)*(k+1);ws+=k+1});if(ws)avg/=ws;
 const plain=n?same.reduce((a,h)=>a+rs(h.r),0)/n:0;
 const ly=addD(date,-364),win=(a,b)=>H.filter(h=>h.d>=addD(ly,a)&&h.d<=addD(ly,b)).map(h=>rdem(h.r)),av=x=>x.reduce((a,b)=>a+b,0)/x.length;
 const A=win(-14,14),B=win(-70,-15);let sea=1;if(A.length>=5&&B.length>=5&&av(B)>0)sea=Math.min(1.6,Math.max(.6,av(A)/av(B)));
 const adj=1+(+S.adj[date]||0)/100,rec=n?Math.ceil(avg*sea*adj*(1+(+S.set.buf||0)/100)):0;
 return{n,avg,plain,sea,adj,rec,outs:same.filter(h=>h.r.out).length,vals:same.map(h=>rs(h.r))}}

function oven(d){

 S.prods.filter(p=>tot[p.id]>0).forEach(p=>{const b=[...p.steps].reverse().find(isBake);if(!b)return;if(!(+p.tray>0)){miss.push(p.name);return}const n=bakeN(p.id,tot[p.id]);(grp[+p.temp||0]=grp[+p.temp||0]||[]).push({p,tr:Math.ceil(n/p.tray),mins:+b.mins||0})});
 const loads=[];Object.keys(grp).sort((a,b)=>b-a).forEach(t=>{let cur=null;grp[t].sort((a,b)=>b.mins-a.mins).forEach(x=>{let left=x.tr;while(left>0){if(!cur||cur.used>=cap){cur={t:+t,used:0,mins:0,items:[]};loads.push(cur)}const put=Math.min(left,cap-cur.used);cur.used+=put;cur.mins=Math.max(cur.mins,x.mins);cur.items.push({name:x.p.name,tr:put});left-=put}})});

function money(d){
 const tot={},ord={};dOf(d).forEach(o=>{tot[o.pid]=(tot[o.pid]||0)+o.qty;if(!o.par)ord[o.pid]=(ord[o.pid]||0)+o.qty});
 let rev=0,cost=0,waste=0,guess=false;

 return`<div class="row kh"><div class="grow"><div class="mut">Kitchen board</div><h2 class="dayh">${dlab(d)}</h2></div><div class="kclock">${hh(now)}</div></div>

 ${E.length?`<div class="bar"><i style="width:${done/E.length*100}%"></i></div><p class="knext">${nxt?`Next: <b>${esc(nxt.n)}</b> at ${hh(nxt.st)}`:'<b>All done.</b>'}</p><p class="mut">Moving a card to Doing starts its timer. You’ll hear an alarm when it’s done and when a step is due to start. Tap anywhere once so the sound can play, and keep this screen open.</p><div class="kb">${col(0,'To do')}${col(1,'Doing')}${col(2,'Done')}</div>`:'<div class="card"><p class="chalk">Nothing on the board</p><p class="mut">Add orders or daily targets for this day.</p></div>'}`}

function sched(d){
 const tot=totOf(d),end=endOf(d),out=[];
 S.prods.filter(p=>tot[p.id]>0).forEach(p=>{let t=pEnd(p,d);const a=[];for(let j=p.steps.length-1;j>=0;j--){const s=p.steps[j],st=t-(+s.mins||0)*6e4;a.unshift({k:p.id+'#'+j,j,fd:d,st,t,n:s.n||'Step '+(j+1),dsc:s.d||'',ps:[{id:p.id,name:p.name,q:tot[p.id]}]});t=st}out.push(...a)});
 return out.sort((a,b)=>a.st-b.st||a.t-b.t)}
const PAL=['#69504c','#a9b79f','#d9c39b','#8e9aa3','#c98f6f','#000000','#b5a8c9'];
const pcol=pid=>PAL[Math.max(0,S.prods.findIndex(p=>p.id==pid))%PAL.length];
const kOpen=new Set(),kShut=new Set();
function kTog(pid,all){const s=all?kOpen:kShut;s.has(pid)?s.delete(pid):s.add(pid);draw()}
function kSet(k,n,auto){
 const d=pday(),E=sched(d),e=E.find(x=>x.k==k);if(!e)return;
 const M=S.kb[d]=S.kb[d]||{};S.kbt=S.kbt||{};const T=S.kbt[d]=S.kbt[d]||{};
 M[k]=n;if(n==1)T[k]={s:Date.now(),x:0};else delete T[k];
 if(n==2&&auto){const nx=E.find(x=>x.ps[0].id==e.ps[0].id&&x.j==e.j+1);if(nx&&!M[nx.k]){M[nx.k]=1;T[nx.k]={s:Date.now(),x:0};flash(`${nx.n} started`)}}
 if(!Object.keys(T).length)delete S.kbt[d];
 kAl=kAl.filter(a=>a.k!=k);rAlm();save();draw()}
function kPlus(ev,k,min){ev.stopPropagation();const d=pday(),T=S.kbt&&S.kbt[d]&&S.kbt[d][k];if(T){T.x=(+T.x||0)+min;kAl=kAl.filter(a=>a.k!=k);rAlm();save();draw()}}
function kitchen(){
 const d=pday(),E=dayWork(d),now=Date.now(),st=e=>(((S.kb||{})[e.fd]||{})[e.k])||0,TTf=e=>((S.kbt||{})[e.fd]||{})[e.k];
 const lanes=[];E.forEach(e=>{const lk=e.ps[0].id+'@'+e.fd;let L=lanes.find(l=>l.key==lk);if(!L){L={key:lk,fd:e.fd,id:e.ps[0].id,name:e.ps[0].name,q:bakeN(e.ps[0].id,e.ps[0].q),steps:[]};lanes.push(L)}L.steps.push(e)});
 lanes.forEach(L=>{L.steps.sort((a,b)=>a.j-b.j);L.done=L.steps.filter(e=>st(e)==2).length;L.all=L.done==L.steps.length;L.cur=L.steps.find(e=>st(e)!=2);L.busy=!L.all&&(L.done>0||L.steps.some(e=>st(e)==1))});
 const active=lanes.filter(L=>L.busy).sort((a,b)=>a.cur.st-b.cur.st),wait=lanes.filter(L=>!L.busy&&!L.all).sort((a,b)=>a.cur.st-b.cur.st),fin=lanes.filter(L=>L.all);
 const doing=E.filter(e=>st(e)==1),nextUp=[...active,...wait].map(L=>L.cur).filter(e=>st(e)==0).sort((a,b)=>a.st-b.st)[0];
 const total=E.length,dn=E.filter(e=>st(e)==2).length;
 const timer=e=>{const T=TTf(e);if(!T)return'';const end=tEnd(e,T),r=Math.round((end-now)/1000);return`<span class="kcd${r<0?' over':''}" data-end="${end}">${r>=0?fmt(r)+' left':'Over by '+fmt(-r)}</span>`};
 const stepRow=(L,e)=>{const s=st(e),isCur=e==L.cur,late=s==0&&isCur&&e.st<now;
  if(s==2)return`<div class="ks done" onclick="kSet('${e.k}',0,0,'${e.fd}')" title="Tap to undo"><span class="ki">✓</span><span class="grow">${esc(e.n)}</span><span class="mut">undo</span></div>`;
  if(!isCur)return`<div class="ks later"><span class="ki">${e.j+1}</span><span class="grow">${esc(e.n)}</span><span class="mut">${kt(e.st,d)} · ${hm(Math.round((e.t-e.st)/6e4))}</span></div>`;
  return`<div class="ks cur${s==1?' doing':''}${late?' late':''}"><div class="row" style="margin:0"><span class="ki">${e.j+1}</span><div class="grow"><div class="kn">${esc(e.n)}</div><div class="mut">${kt(e.st,d)}–${kt(e.t,d)} · ${hm(Math.round((e.t-e.st)/6e4))}${late?' · should have started':''}</div>${e.dsc?`<div class="kd">${esc(e.dsc)}</div>`:''}</div></div>
   <div class="row kx">${s==1?`${timer(e)}<span class="grow"></span><button class="g sm" onclick="kPlus(event,'${e.k}',5,'${e.fd}')">+5 min</button><button class="g sm" onclick="kSet('${e.k}',0,0,'${e.fd}')">Not yet</button><button class="b" onclick="kSet('${e.k}',2,true,'${e.fd}')">Done</button>`:`<span class="grow"></span><button class="g sm" onclick="kSet('${e.k}',2,0,'${e.fd}')">Mark done</button><button class="b" onclick="kSet('${e.k}',1,0,'${e.fd}')">Start</button>`}</div></div>`};
 const lane=L=>{const col=pcol(L.id),open=L.all?kOpen.has(L.key):!kShut.has(L.key),c=L.cur,stx=L.all?'✓ Finished':st(c)==1?`Doing: ${esc(c.n)}`:`Next: ${esc(c.n)} at ${hh(c.st)}`;
  return`<section class="lane${L.busy?' on':''}${L.all?' fin':''}" style="--lc:${col}"><div class="ln-h" onclick="kTog('${L.key}',${L.all})"><div class="grow"><div class="ln-n">${esc(L.name)} <span class="ln-q">× ${L.q}</span></div>${L.fd!=d?`<div class="ln-for">For ${dlab(L.fd)}</div>`:''}<div class="ln-s">${stx} · ${L.done} of ${L.steps.length}</div></div>${L.all?'':`<button class="g sm" onclick="event.stopPropagation();goCook(${S.prods.findIndex(p=>p.id==L.id)})">Cook mode</button>`}<span class="ln-c">${open?'▴':'▾'}</span></div><div class="ln-bar"><i style="width:${L.done/L.steps.length*100}%"></i></div>${open?`<div class="ln-b">${laneIng(L)}${L.steps.map(e=>stepRow(L,e)).join('')}${L.all?noteBox(L.id,'kb'):`<details class="qa ln-note"><summary>Add a bake note</summary>${noteBox(L.id,'kb')}</details>`}</div>`:''}</section>`};
 return`<div class="row kh"><div class="grow"><div class="mut">${d==tdy()?'Today':dlabR(d)}</div><h2 class="dayh">${dlab(d)}</h2></div><div class="kclock">${hh(now)}</div></div>
 <div class="row kctl">${kbig?'<button class="g" onclick="kBig(false)">Exit big screen</button>':`<button class="g sm" onclick="shd(-1)" aria-label="Previous day">‹</button>${d==tdy()?'':'<button class="g sm" onclick="shd(0)">Today</button>'}<button class="g sm" onclick="shd(1)" aria-label="Next day">›</button><button class="g sm" onclick="kBig(true)">Big screen</button>`}<button class="g sm" onclick="setMute(${!muted})">${muted?'Sound off':'Sound on'}</button></div>
 <div class="row"><span class="mut grow">${dn} of ${total} steps done</span>${dn?'<button class="g sm" onclick="kreset()">Reset</button>':''}</div>
 ${E.length?`<div class="bar"><i style="width:${total?dn/total*100:0}%"></i></div>
 <div class="know">${doing.length?doing.map(e=>`<div class="kn1" style="--lc:${pcol(e.ps[0].id)}"><span class="mut">Doing</span> <b>${esc(e.n)}</b> · ${esc(e.ps[0].name)} ${timer(e)}</div>`).join(''):''}${nextUp?`<div class="kn1 nx" style="--lc:${pcol(nextUp.ps[0].id)}"><span class="mut">Next</span> <b>${esc(nextUp.n)}</b> · ${esc(nextUp.ps[0].name)} <span class="mut">at ${hh(nextUp.st)}</span></div>`:''}${!doing.length&&!nextUp?'<div class="kn1"><b>All done for this day.</b></div>':''}</div>
 <div class="lanes">${[...active,...wait].map(lane).join('')}</div>
 ${fin.length?`<h3 class="fin-h">Finished · ${fin.length}</h3><div class="lanes">${fin.map(lane).join('')}</div>`:''}
 <p class="mut">Press Start to begin a step and its timer. Done finishes it and starts the next step. You’ll hear an alarm when a timer ends and when a step is due. Tap the screen once so sound can play, and keep this screen open.</p>`
 :'<div class="card"><p class="chalk">Nothing on the board</p><p class="mut">Add orders or daily targets for this day.</p></div>'}`}

function kSet(k,n,auto,fd){

 M[k]=n;if(n==1)T[k]={s:Date.now(),x:0};else delete T[k];
 if(n==2&&auto){const nx=E.find(x=>x.ps[0].id==e.ps[0].id&&x.j==e.j+1);if(nx&&!M[nx.k]){M[nx.k]=1;T[nx.k]={s:Date.now(),x:0};flash(`${nx.n} started`)}}
 if(!Object.keys(T).length)delete S.kbt[fd];

 const R=runTimers();

 dayWork(tdy()).forEach(e=>{const M=(S.kb||{})[e.fd]||{},id='s|'+e.fd+'|'+e.k;if(!M[e.k]&&now>=e.st&&now-e.st<180000&&!fired.has(id)){fired.add(id);ring(`Time to start: ${e.n}`,e,false)}});
 kAl.forEach(a=>{if(a.strong&&a.n<6&&now-a.last>20000){a.n++;a.last=now;tone(3,880);buzz(true)}});
 const tb=document.getElementById('tbar');
 if(tb){const show=R.length&&!(tab=='Kitchen'||tab=='Today');const h=show?R.slice(0,3).map(t=>{const r=Math.round((t.end-now)/1000);return`<button class="tp${r<0?' over':''}" onclick="go('Kitchen')">${esc(t.e.n)} <b>${r>=0?fmt(r):'+'+fmt(-r)}</b></button>`}).join(''):'';if(tb.innerHTML!=h)tb.innerHTML=h}}

let tShowDone=false;
const kst=e=>(((S.kb||{})[e.fd]||{})[e.k])||0;
const ktm=e=>((S.kbt||{})[e.fd]||{})[e.k];
function workDay(d){
 const ev=[],ready=[],lanes={};
 for(let i=0;i<=4;i++){const x=addD(d,i);sched(x).forEach(e=>{const lk=e.ps[0].id+'@'+x;(lanes[lk]=lanes[lk]||[]).push(e)})}
 Object.entries(lanes).forEach(([lk,E])=>{E.sort((a,b)=>a.j-b.j);const cur=E.find(e=>kst(e)!=2),end=E[E.length-1].t;
  E.forEach(e=>{const on=e.st>=dS(d)&&e.st<dE(d),carry=e.st<dS(d)&&e.t>dS(d);if(on||carry)ev.push({...e,lk,carry,cur:e==cur,first:e.j==0})});
  if(end>=dS(d)&&end<dE(d)){const p=S.prods.find(q=>q.id==E[0].ps[0].id);ready.push({t:end,name:E[0].ps[0].name,q:bakeN(E[0].ps[0].id,E[0].ps[0].q),fd:E[0].fd,done:!cur,id:E[0].ps[0].id})}});
 ev.sort((a,b)=>(a.carry?0:1)-(b.carry?0:1)||a.st-b.st||a.t-b.t);ready.sort((a,b)=>a.t-b.t);
 return{ev,ready}}
function nextJob(d){for(let i=1;i<=7;i++){const x=addD(d,i),w=workDay(x).ev.filter(e=>!e.carry&&kst(e)!=2);if(w.length)return w[0]}return null}
function ingLine(pid,q){const p=S.prods.find(x=>x.id==pid);if(!p)return'';const n=bakeN(pid,q);return mergeL(calc(p).lines).map(l=>`${esc(l.n)} ${fq(l.g*n,bu(l.n))}`).join(' · ')}
function homeToday(){const w=workDay(tdy()),left=w.ev.filter(e=>kst(e)!=2),nx=left.find(e=>kst(e)==0);return w.ev.length?`${left.length?`${left.length} job${left.length>1?'s':''} left`:'All done'}${nx?` · next ${hh(nx.st)} ${esc(nx.n)}`:''}`:'Nothing to do today'}
function tTimer(e){const T=ktm(e);if(!T)return'';const end=tEnd(e,T),r=Math.round((end-Date.now())/1000);return`<span class="kcd${r<0?' over':''}" data-end="${end}">${r>=0?fmt(r)+' left':'Over by '+fmt(-r)}</span>`}
function today(){
 const d=pday(),now=Date.now(),{ev,ready}=workDay(d),isT=d==tdy();
 const doing=ev.filter(e=>kst(e)==1),todo=ev.filter(e=>kst(e)==0),done=ev.filter(e=>kst(e)==2);
 const nx=todo.filter(e=>!e.carry).sort((a,b)=>a.st-b.st)[0];
 const fdTag=e=>e.fd!=d?`<span class="bd">for ${new Date(e.fd+'T12:00').toLocaleDateString('en-IE',{weekday:'short'})}</span>`:'';
 const item=e=>{const s=kst(e),late=s==0&&e.st<now&&isT,act=e.cur&&s!=2;
  if(s==2)return`<div class="it d" onclick="kSet('${e.k}',0,0,'${e.fd}')" title="Tap to undo"><div class="row"><span class="tm">${hh(e.st)}</span><span class="grow">${esc(e.n)} · ${esc(e.ps[0].name)}</span>${fdTag(e)}<span class="mut sm2">✓ done</span></div></div>`;
  return`<div class="it${act?' c':''}${s==1?' on':''}${late?' late':''}"><div class="row"><span class="tm">${e.carry?'<span class="mut">from</span> '+hh(e.st):hh(e.st)}</span><span class="grow"><b>${esc(e.n)}</b> · ${bakeN(e.ps[0].id,e.ps[0].q)} × ${esc(e.ps[0].name)}</span>${fdTag(e)}</div>
  <div class="ix"><span class="mut">${e.carry?`started ${dayRel(e.st).toLowerCase()} · until ${hh(e.t)}`:`${hm(Math.round((e.t-e.st)/6e4))} · until ${hh(e.t)}`}${late?' · <span class="lt">late</span>':''}</span>${e.dsc?`<div>${esc(e.dsc)}</div>`:''}${act&&e.first&&s==0?`<div class="ing2">${ingLine(e.ps[0].id,e.ps[0].q)}</div>`:''}
  ${act?`<div class="row" style="margin-top:6px">${s==1?`${tTimer(e)}<span class="grow"></span><button class="g sm" onclick="kPlus(event,'${e.k}',5,'${e.fd}')">+5 min</button><button class="b sm" onclick="kSet('${e.k}',2,true,'${e.fd}')">Done</button>`:`<span class="grow"></span>${e.first?`<button class="g sm" onclick="goCook(${S.prods.findIndex(p=>p.id==e.ps[0].id)})">Weigh</button>`:''}<button class="g sm" onclick="kSet('${e.k}',2,0,'${e.fd}')">Mark done</button><button class="b sm" onclick="kSet('${e.k}',1,0,'${e.fd}')">Start</button>`}</div>`:''}</div></div>`};
 const block=(t,list)=>list.length?`<div class="h3">${t}</div><div class="tl">${list.map(item).join('')}</div>`:'';
 const vis=ev.filter(e=>tShowDone||kst(e)!=2),hr=e=>new Date(e.st).getHours();
 const carry=vis.filter(e=>e.carry),rest=vis.filter(e=>!e.carry);
 const head=`<div class="row"><div class="grow"><div class="mut">${isT?'Today':(r=>['Tomorrow','Yesterday'].includes(r)?r:'Work day')(dayRel(dS(d)+432e5))}</div><h2 class="dayh">${new Date(d+'T12:00').toLocaleDateString('en-IE',{weekday:'long',day:'numeric',month:'short'})}</h2></div><button class="g sm" onclick="shd(-1)" aria-label="Previous day">‹</button>${isT?'':'<button class="g sm" onclick="shd(0)">Today</button>'}<button class="g sm" onclick="shd(1)" aria-label="Next day">›</button></div>`;
 if(!ev.length){const n=nextJob(d);return guide()+head+`<div class="card"><p class="chalk">Nothing to do ${isT?'today':'this day'}</p>${n?`<p>Next job: <b>${esc(n.n)}</b> · ${esc(n.ps[0].name)}, ${whenT(n.st)}</p><p><button class="b" onclick="setDay('${tz(new Date(n.st)).slice(0,10)}')">Go to that day</button></p>`:'<p class="mut">Add orders or daily targets and your jobs appear here, on the day you need to do them.</p><div class="row"><button class="b" onclick="ov=\'targets\';go(\'Orders\')">Set daily targets</button><button class="g" onclick="ov=\'orders\';go(\'Orders\')">Add an order</button></div>'}</div>`+pickups(d)+checks(d)}
 const nowBox=`<div class="now2">${doing.length?doing.map(e=>`<div class="row"><div class="grow"><div class="mut">Doing now</div><b>${esc(e.n)}</b> · ${esc(e.ps[0].name)}</div>${tTimer(e)}</div>`).join(''):''}${nx?`<div class="row"><div class="grow"><div class="mut">${doing.length?'Next':'First job'}</div><b>${esc(nx.n)}</b> · ${esc(nx.ps[0].name)}</div><div class="nxt"><b>${hh(nx.st)}</b><div class="mut">${isT?untilT(nx.st):''}</div></div></div>`:(!doing.length?'<div><b>All done for this day.</b></div>':'')}</div>`;
 return guide()+head+nowBox+
  `<div class="row" style="margin-top:4px"><span class="mut grow">${done.length} of ${ev.length} jobs done</span>${done.length?`<button class="g sm" onclick="tShowDone=!tShowDone;draw()">${tShowDone?'Hide done':'Show done'}</button>`:''}</div><div class="bar"><i style="width:${ev.length?done.length/ev.length*100:0}%"></i></div>`+
  block('Carried over',carry)+block('Morning',rest.filter(e=>hr(e)<12))+block('Afternoon',rest.filter(e=>hr(e)>=12&&hr(e)<17))+block('Evening',rest.filter(e=>hr(e)>=17))+
  (ready.length?`<div class="h3">Ready ${isT?'today':'this day'}</div>${ready.map(r=>`<div class="trow"><span class="tm">${hh(r.t)}</span><span class="grow ${r.done?'mut':''}">${r.done?'✓ ':''}${r.q} × ${esc(r.name)}${r.fd!=d?` <span class="bd">for ${new Date(r.fd+'T12:00').toLocaleDateString('en-IE',{weekday:'short'})}</span>`:''}</span><button class="g sm" onclick="vw=${S.prods.findIndex(p=>p.id==r.id)};go('Products')">Recipe</button></div>`).join('')}`:'')+
  pickups(d)+checks(d)}
function pickups(d){
 const P=S.orders.map((o,i)=>[o,i]).filter(([o])=>o.date==d).sort((a,b)=>(a[0].time||'99').localeCompare(b[0].time||'99'));if(!P.length)return'';
 return`<div class="h3">Pickups</div>${P.map(([o,i])=>`<div class="trow"><span class="tm">${esc(o.time||'—')}</span><div class="grow"><div class="${o.done?'mut':''}">${esc(o.cust)} · ${o.qty} × ${esc((S.prods.find(p=>p.id==o.pid)||{name:'?'}).name)}</div>${o.note?`<div class="mut">${esc(o.note)}</div>`:''}</div><span class="tbtn"><button class="g sm${o.packed?' on':''}" onclick="tgo(${i},'packed',${!o.packed})">${o.packed?'✓ Packed':'Packed'}</button><button class="g sm${o.done?' on':''}" onclick="tgo(${i},'done',${!o.done})">${o.done?'✓ Collected':'Collected'}</button></span></div>`).join('')}`}
function checks(d){
 const tot=totOf(d),act=S.prods.filter(p=>tot[p.id]>0),chips=[];
 if(act.length){
  const o=oven(d),mo=money(d);
  chips.push([o.loads.length>1?`! Oven today: ${o.loads.length} loads`:o.loads.length?'✓ Oven: one load':o.miss.length?'! Oven not set up':'Oven: no bake step',"go('Plan')",o.loads.length<=1&&!o.miss.length]);
  chips.push([`${mo.profit>=0?'✓':'!'} ${mo.profit>=0?m(mo.profit)+' profit':m(-mo.profit)+' loss'}`,"go('Plan')",mo.profit>=0]);
  const cnt={};dOf(d).filter(x=>x.par).forEach(x=>cnt[x.pid]=(cnt[x.pid]||0)+x.qty);
  const diff=S.set.useFc?[]:S.prods.filter(p=>{const f=fcast(p.id,d),c=cnt[p.id]||0;return f.n>=3&&Math.abs(f.rec-c)>=Math.max(3,c*.1)});
  if(diff.length)chips.push([`! Forecast differs: ${esc(diff[0].name)}`,"ov='forecast';go('Orders')",false])}
 const rec=(S.sales||{})[d];chips.push([rec?'✓ Sales recorded':'Record sales at closing',`salesFor('${d}')`,!!rec]);
 const N=needW(d),hv=N.filter(x=>S.have[d+'|'+key(x.n)]).length;if(N.length)chips.unshift([`${hv==N.length?'✓':'!'} Ingredients ${hv} of ${N.length}`,"hvOpen=true;draw();setTimeout(()=>{const e=document.getElementById('hv');e&&e.scrollIntoView({behavior:'smooth'})},50)",hv==N.length]);
 return`<div class="h3">Checks</div><div class="chips2">${chips.map(c=>`<button class="chk2${c[2]?'':' warn'}" onclick="${c[1]}">${c[0]}</button>`).join('')}</div>
 ${N.length?`<details id="hv" class="card"${hvOpen?' open':''} ontoggle="hvOpen=this.open" style="margin-top:12px"><summary><b>Ingredients for what you start ${d==tdy()?'today':'this day'}</b> <span class="mut">${N.filter(x=>S.have[d+'|'+key(x.n)]).length} of ${N.length} ticked</span></summary>${N.map((x,k)=>{const on=S.have[d+'|'+key(x.n)];return`<div class="trow"><label class="chip chk"><input type="checkbox"${on?' checked':''} onchange="setHave(${k},this.checked)"> <span class="${on?'mut':''}">${esc(x.n)}</span></label><span>${fq(x.g,x.u)}</span></div>`}).join('')}</details>`:''}`}

// schedule: sub-recipe prep is its own lane, finished before the first product that uses it starts
function sched(d){
 const tot=totOf(d),out=[],seen=new Set();
 const lane=(p,q,end)=>{let t=end;const a=[];for(let j=p.steps.length-1;j>=0;j--){const s=p.steps[j],st=t-(+s.mins||0)*6e4;a.unshift({k:p.id+'#'+j,j,fd:d,st,t,n:s.n||'Step '+(j+1),dsc:s.d||'',ps:[{id:p.id,name:p.name,q}]});t=st}return a};
 let lv=S.prods.filter(p=>tot[p.id]>0).map(p=>{seen.add(p.id);const e=pEnd(p,d),a=lane(p,tot[p.id],e);out.push(...a);return{p,n:bakeN(p.id,tot[p.id]),st:a.length?a[0].st:e}});
 for(let r=0;r<4&&lv.length;r++){
  const need={};lv.forEach(({p,n,st})=>calc(p).lines.forEach(l=>{const s=subOf(l.n);if(!s||s.id==p.id||seen.has(s.id))return;const x=need[s.id]=need[s.id]||{s,q:0,end:Infinity};x.q+=l.g*n/(+s.unitG||1);x.end=Math.min(x.end,st)}));
  lv=Object.values(need).map(({s,q,end})=>{seen.add(s.id);q=Math.max(1,Math.ceil(q-1e-6));const a=lane(s,q,end);out.push(...a);return{p:s,n:bakeN(s.id,q),st:a.length?a[0].st:end}})}
 return out.sort((a,b)=>a.st-b.st||a.t-b.t)}

function dCost(sz,oat){const D=S.dr,c=D.cups[sz.s]||{},mi=dIng(oat?D.oat:D.milk);
 const coffee=(+sz.cg||0)*ppu(dIng(D.cof)),milk=(+sz.ml||0)*(1+(+D.waste||0)/100)*ppu(mi),ex=(sz.ex||[]).reduce((a,x)=>a+(+x.a||0)*ppu(dIng(x.n)),0),cup=(+c.cup||0)+(+c.lid||0)+(+c.sl||0);
 return{coffee,milk,ex,cup,tot:coffee+milk+ex+cup}}
const dPrice=(sz,oat)=>(+sz.price||0)+(oat?+S.dr.oatUp||0:0);
const dMg=(sz,oat)=>{const p=dPrice(sz,oat);return p?(p-dCost(sz,oat).tot)/p*100:0};
const dHasMilk=sz=>+sz.ml>20;
let dOpen=new Set();
function dUp(i,j,k,v){const z=S.dr.items[i].sizes[j];z[k]=k=='s'?v:(+v||0);save();draw()}
function dName(i,v){v=(v||'').trim();if(v)S.dr.items[i].name=v;save();draw()}
function dEx(i,j,x,k,v){const e=S.dr.items[i].sizes[j].ex[x];e[k]=k=='a'?(+v||0):v;if(k=='n'&&v&&!dIng(v)){S.ings.push({n:v.trim(),price:0,size:1,unit:'kg',al:[],waste:0});flash(`Added ${v.trim()} to Ingredients. Set its price there.`)}save();draw()}
function dExAdd(i,j){S.dr.items[i].sizes[j].ex.push({n:'',a:0});save();draw()}
function dExDel(i,j,x){S.dr.items[i].sizes[j].ex.splice(x,1);save();draw()}
function dSzAdd(i){const it=S.dr.items[i],l=it.sizes[it.sizes.length-1],s=['8oz','12oz','Espresso cup'].find(x=>!it.sizes.some(z=>z.s==x))||'12oz',big=s=='12oz'&&l.s=='8oz';it.sizes.push({s,price:Math.round(((+l.price||0)+(big?0.4:-0.4))*10)/10,cg:l.cg,ml:Math.round((+l.ml||0)*(big?1.6:1/1.6)),ex:(l.ex||[]).map(e=>({...e,a:Math.round((+e.a||0)*(big?1.4:1/1.4)*10)/10}))});it.sizes.sort((a,b)=>DSZ.indexOf(a.s)-DSZ.indexOf(b.s));save();draw()}
function dSzDel(i,j){const it=S.dr.items[i];if(it.sizes.length<2){dDel(i);return}it.sizes.splice(j,1);save();draw()}
function dAdd(){S.dr.items.push({id:'d'+nid(),name:'New drink',sizes:[{s:'12oz',price:0,cg:18,ml:0,ex:[]}]});dOpen.add(S.dr.items[S.dr.items.length-1].id);save();draw();setTimeout(()=>{const a=document.querySelectorAll('.dnm');a.length&&(a[a.length-1].focus(),a[a.length-1].select())},30)}
function dDel(i){snap(`${S.dr.items[i].name} removed`);S.dr.items.splice(i,1);save();draw()}
function dSet(k,v){S.dr[k]=k=='cof'||k=='milk'||k=='oat'?v:(+v||0);save();draw()}
function dCup(s,k,v){S.dr.cups[s]=S.dr.cups[s]||{};S.dr.cups[s][k]=+v||0;save();draw()}
function dIngP(n,v){const g=dIng(n);if(g){g.price=+v||0;delete g.typ;g.pdate=tdy();save();draw()}}
const pct=g=>`<span class="st-${mst(g)}">${mdot(g)}${g.toFixed(0)}%</span>`;
function drinks(){
 drInit();const D=S.dr,T0=+S.set.margin||65;
 const ingSel=(k,lab)=>{const g=dIng(D[k]),u=g?BASE[g.unit]:'g';return`<div class="row dcrow"><label class="grow">${lab}<select onchange="dSet('${k}',this.value)">${S.ings.map(x=>`<option${key(x.n)==key(D[k])?' selected':''}>${esc(x.n)}</option>`).join('')}</select></label>${g?`<label>Pack price<input type="number" step="any" value="${g.price}" onchange="dIngP('${esc(g.n)}',this.value)"></label><span class="mut">per ${g.size} ${esc(g.unit)} · ${u=='each'?m(ppu(g))+' each':m(ppu(g)*1000)+(u=='ml'?' / l':' / kg')}${g.typ?' · <b class="st-warn">typical price, check</b>':''}</span>`:''}</div>`};
 const setup=`<details class="card dset"${D.typ?' open':''}><summary><b>What a cup costs you</b> <span class="mut">coffee, milk, cups</span></summary>
  ${D.typ?'<p class="mut sm2">These start with typical café amounts and prices, marked “check”. Put in your own and every drink updates.</p>':''}
  ${ingSel('cof','Coffee')}${ingSel('milk','Regular milk')}${ingSel('oat','Oat milk')}
  <div class="row"><label>Steaming waste %<input type="number" step="any" value="${D.waste}" onchange="dSet('waste',this.value)"></label><label>Oat milk extra charge (€)<input type="number" step="any" value="${D.oatUp}" onchange="dSet('oatUp',this.value)"></label>${+D.oatUp?'':'<span class="mut grow sm2">No extra charge for oat. Oat drinks cost you more, so the oat column shows their lower margin.</span>'}</div>
  ${(()=>{const o=S.ings.filter(g=>g.typ&&![D.cof,D.milk,D.oat].some(n=>key(n)==key(g.n)));return o.length?`<h4>Other drink ingredients</h4>${o.map(g=>`<div class="row dcrow"><b class="grow">${esc(g.n)}</b><label>Pack price<input type="number" step="any" value="${g.price}" onchange="dIngP('${esc(g.n)}',this.value)"></label><span class="mut">per ${g.size} ${esc(g.unit)} · <b class="st-warn">typical price, check</b></span></div>`).join('')}`:''})()}
  <h4>Cup, lid and sleeve per size</h4>${DSZ.map(s=>{const c=D.cups[s]||{};return`<div class="row dcrow"><b class="dsz">${s}</b><label>Cup<input type="number" step="any" value="${+c.cup||0}" onchange="dCup('${s}','cup',this.value)"></label><label>Lid<input type="number" step="any" value="${+c.lid||0}" onchange="dCup('${s}','lid',this.value)"></label><label>Sleeve<input type="number" step="any" value="${+c.sl||0}" onchange="dCup('${s}','sl',this.value)"></label></div>`}).join('')}
  ${D.typ?`<p><button class="g sm" onclick="delete S.dr.typ;save();draw()">I’ve checked these</button></p>`:''}</details>`;
 const rowsFor=(it,i)=>it.sizes.map((z,j)=>{const r=dCost(z,0),o=dCost(z,1),hm=dHasMilk(z);return`<div class="dsrow"><span class="dsz">${esc(z.s)}</span><span class="dpr">${m(dPrice(z,0))}</span><span class="mut dco">cost ${m(r.tot)}</span>${pct(dMg(z,0))}<span class="doat">${hm?`<span class="mut">oat</span> ${pct(dMg(z,1))}`:''}</span></div>`}).join('');
 const edit=(it,i)=>`<div class="ded"><div class="row"><label class="grow">Name<input class="dnm" value="${esc(it.name)}" onchange="dName(${i},this.value)"></label></div>${it.sizes.map((z,j)=>{const r=dCost(z,0);return`<div class="dszb"><div class="row"><label>Size<select onchange="dUp(${i},${j},'s',this.value)">${DSZ.map(s=>`<option${s==z.s?' selected':''}>${s}</option>`).join('')}</select></label><label>Price (€)<input type="number" step="any" value="${z.price}" onchange="dUp(${i},${j},'price',this.value)"></label><label>Coffee (g)<input type="number" step="any" value="${z.cg}" onchange="dUp(${i},${j},'cg',this.value)"></label><label>Milk (ml)<input type="number" step="any" value="${z.ml}" onchange="dUp(${i},${j},'ml',this.value)"></label></div>
   ${(z.ex||[]).map((e,x)=>{const g=dIng(e.n);return`<div class="row"><input class="grow" list="dingl" value="${esc(e.n)}" placeholder="Ingredient, e.g. syrup" onchange="dEx(${i},${j},${x},'n',this.value)"><input type="number" step="any" class="smin" value="${e.a}" onchange="dEx(${i},${j},${x},'a',this.value)"><span class="mut">${g?BASE[g.unit]:'g'}</span><button class="g sm" onclick="dExDel(${i},${j},${x})" aria-label="Remove">×</button></div>`}).join('')}
   <div class="row"><button class="lnk" onclick="dExAdd(${i},${j})">+ Other ingredient</button><span class="grow"></span><span class="mut sm2">coffee ${m(r.coffee)} · milk ${m(r.milk)}${r.ex?` · other ${m(r.ex)}`:''} · cup ${m(r.cup)}</span>${it.sizes.length>1?`<button class="lnk" onclick="dSzDel(${i},${j})">Remove size</button>`:''}</div></div>`}).join('')}
  <div class="row">${it.sizes.length<DSZ.length?`<button class="g sm" onclick="dSzAdd(${i})">+ Add a size</button>`:''}<span class="grow"></span><button class="lnk" onclick="dDel(${i})">Delete drink</button><button class="b sm" onclick="dOpen.delete('${it.id}');draw()">Done</button></div></div>`;
 const list=D.items.map((it,i)=>{const op=dOpen.has(it.id);return`<div class="drw${op?' op':''}"><button class="dhd" onclick="dOpen.has('${it.id}')?dOpen.delete('${it.id}'):dOpen.add('${it.id}');draw()"><b class="grow">${esc(it.name)}</b><span class="mut">${op?'▴':'▾'}</span></button>${rowsFor(it,i)}${op?edit(it,i):''}</div>`}).join('');
 const all=D.items.flatMap(it=>it.sizes.map(z=>({it,z}))),low=all.filter(x=>dMg(x.z,0)<T0).length,lowO=all.filter(x=>dHasMilk(x.z)&&dMg(x.z,1)<T0).length;
 return`<datalist id="dingl">${S.ings.map(g=>`<option value="${esc(g.n)}">`).join('')}</datalist><div class="row"><h2 class="grow" style="margin:0">Coffee and drinks</h2><button class="b" onclick="dAdd()">+ New drink</button></div>
 <p class="mut">Cost per cup with coffee, milk (plus ${D.waste}% steaming waste), other ingredients and the cup. Margins against your ${T0}% target${low||lowO?`: <b class="st-bad">${low} below with regular milk${lowO?`, ${lowO} with oat`:''}</b>`:', all on target'}.</p>
 ${setup}<div class="dlist">${list}</div>`}
// drinks in Margins and on the menu board
const menuD=T.Menu;
T.Menu=()=>{const h=menuD();if(!S.dr||!S.dr.items.length)return h;const T0=+S.set.margin||65;
 const rows=S.dr.items.flatMap((it,i)=>it.sizes.map(z=>({it,i,z,g:dMg(z,0)}))).sort((a,b)=>a.g-b.g);
 return h+`<h3 style="margin-top:28px">Coffee and drinks</h3><div class="mlist">${rows.map(r=>`<button class="mrw" onclick="dOpen.add('${r.it.id}');go('Drinks')"><span class="grow"><b>${esc(r.it.name)}</b><span class="mut">${esc(r.z.s)}${dHasMilk(r.z)?` · oat ${dMg(r.z,1).toFixed(0)}%`:''}</span></span><span class="prm"><span>${m(r.z.price)}</span><span class="mut">cost ${m(dCost(r.z,0).tot)}</span></span><span class="prg st-${mst(r.g)}"><span>${mdot(r.g)}${r.g.toFixed(0)}%</span>${r.g<T0?`<span class="mut sug">→ ${m(Math.ceil(dCost(r.z,0).tot/(1-Math.min(T0,95)/100)*20)/20)}</span>`:''}</span></button>`).join('')}</div>`};
const boardD=T.Board;
T.Board=()=>{let h=boardD();if(!S.dr||!S.dr.items.length)return h;
 const dal=it=>[...new Set(it.sizes.flatMap(z=>[...(dHasMilk(z)?(dIng(S.dr.milk)||{al:[]}).al||[]:[]),...(z.ex||[]).flatMap(e=>(dIng(e.n)||{al:[]}).al||[])]))].map(a=>AL.indexOf(a)+1).filter(x=>x>0).sort((a,b)=>a-b).join(',');
 const col=`<div><h3>Coffee</h3>${S.dr.items.map(it=>`<div class="bi"><span>${esc(it.name)}${dal(it)?` <sup>${dal(it)}</sup>`:''}${it.sizes.length>1||it.sizes[0].s!='12oz'?` <span class="bsz2">${it.sizes.map(z=>z.s=='Espresso cup'?'':esc(z.s)).filter(Boolean).join(' / ')}</span>`:''}</span><i></i><b>${it.sizes.map(z=>m(z.price)).join(' / ')}</b></div>`).join('')}${+S.dr.oatUp?`<p class="bnt">Oat milk +${m(S.dr.oatUp)}</p>`:'<p class="bnt">Oat milk available</p>'}</div>`;
 return h.includes('<div class="bcols">')?h.replace('<div class="bcols">','<div class="bcols">'+col):h.replace('<p class="chalk">Add prices to your products and the menu appears here</p>','<div class="bcols">'+col+'</div>')};
G.find(g=>g[0]=='Recipes')[1].push('Drinks');TL.Products='Bakery';TL.Drinks='Coffee and drinks';T.Drinks=drinks;

draw();
</script></body></html>
